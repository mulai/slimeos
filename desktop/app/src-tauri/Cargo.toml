[package]
name = "slimeos-desktop"
version = "0.1.0"
description = "Slime OS: your Brain's desktop on this PC"
authors = ["Mulai Pte. Ltd."]
license = "Proprietary"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
