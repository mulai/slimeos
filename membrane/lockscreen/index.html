  <div id="screenRoot"></div>

  <div id="modalRoot"></div>

  <!-- Floating host for the Timezone tab's dropdown -- a sibling of
       screenRoot/modalRoot, not a descendant of the Settings panel's
       .settings-body, specifically so it isn't clipped by that panel's
       own overflow-y:auto (confirmed live 2026-08-14: nested inside the
       panel, the list rendered but got cropped at the panel's bottom
       edge). Positioned via JS (getBoundingClientRect of the input),
       cleared on every render() so it can never outlive the tab that
       opened it. -->
  <div id="tzDropdownRoot"></div>

</div>

<script>
(function(){
  'use strict';

  /* ===================== SVG assets (inlined, no network) ===================== */

  function slimeBlobSVG(size, colorMode, showDrip){
    var gradId = 'slimeBody_' + Math.random().toString(36).slice(2);
    var glossId = 'slimeGloss_' + Math.random().toString(36).slice(2);
    var fill = colorMode === 'white' ? '#FFFFFF' : colorMode === 'black' ? '#0D1117' : ('url(#' + gradId + ')');
    var drip = showDrip ? '<path d="M60,90 C57,97 53,103 53,107 A7,7 0 1,0 67,107 C67,103 63,97 60,90 Z" fill="' + fill + '"></path>' : '';
    var gloss = colorMode === 'color' ? (
      '<ellipse cx="45" cy="33" rx="13" ry="7.5" transform="rotate(-38 45 33)" fill="url(#' + glossId + ')"></ellipse>' +
      '<circle cx="87" cy="38" r="2.8" fill="#ffffff" fill-opacity="0.5"></circle>'
    ) : '';
    var viewBox = showDrip ? '0 0 120 122' : '0 0 120 104';
    return (
      '<svg viewBox="' + viewBox + '" width="' + size + '" height="' + (size * (showDrip ? 122/120 : 104/120)) + '" style="display:block">' +
        '<defs>' +
          '<linearGradient id="' + gradId + '" x1="0" y1="0" x2="0.25" y2="1">' +
            '<stop offset="0" stop-color="#00F2FE"></stop>' +
            '<stop offset="0.16" stop-color="#1FD6C6"></stop>' +
            '<stop offset="0.5" stop-color="#00C2A8"></stop>' +
            '<stop offset="1" stop-color="#008B99"></stop>' +
          '</linearGradient>' +
          '<radialGradient id="' + glossId + '" cx="0.34" cy="0.26" r="0.55">' +
            '<stop offset="0" stop-color="#ffffff" stop-opacity="0.9"></stop>' +
            '<stop offset="0.6" stop-color="#ffffff" stop-opacity="0.12"></stop>' +
            '<stop offset="1" stop-color="#ffffff" stop-opacity="0"></stop>' +
          '</radialGradient>' +
        '</defs>' +
        drip +
        '<path fill-rule="evenodd" fill="' + fill + '" d="M60,8 C84.3,8 104,27.7 104,52 C104,76.3 84.3,96 60,96 C35.7,96 16,76.3 16,52 C16,27.7 35.7,8 60,8 Z M60,30 C72.15,30 82,39.85 82,52 C82,64.15 72.15,74 60,74 C47.85,74 38,64.15 38,52 C38,39.85 47.85,30 60,30 Z"></path>' +
        gloss +
      '</svg>'
    );
  }

  var ACCENTS = ['#00C2A8', '#4FACFE', '#00FF87'];
  var STAGE_FALLBACK = 'Waking up your Brain\u2026';
  var HOST_RE = /^(?:(?:\d{1,3}\.){3}\d{1,3}|[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*)$/;

  /* ===================== state ===================== */

  var current = { state: 'empty', data: {} };
  var pendingRemoveId = null;
  var clockDate = null;
  var clockTimer = null;

  var screenRoot = document.getElementById('screenRoot');
  var modalRoot = document.getElementById('modalRoot');

  function emit(name, detail){
    document.dispatchEvent(new CustomEvent(name, { detail: detail || {} }));
  }

  function escapeHtml(str){
    return String(str == null ? '' : str).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  // The "Signed in as ..." line on empty/picker is on-screen indefinitely
  // on a kiosk anyone walking by can see -- mask most of the local part
  // (where a real name usually lives) but keep the domain visible, e.g.
  // "tommy@gmail.com" -> "t***y@gmail.com".
  function maskEmail(email){
    var parts = String(email || '').split('@');
    if (parts.length !== 2 || !parts[0]) return String(email || '');
    var local = parts[0], domain = parts[1];
    var masked = local.length <= 2 ? (local.charAt(0) + '*') : (local.charAt(0) + '***' + local.charAt(local.length - 1));
    return masked + '@' + domain;
  }

  /* ===================== crash reporting =====================
     Always fires on any uncaught error/rejection, regardless of the user's
     reporting choice -- this page never checks consent itself (see
     'slime:crash-report' in the header comment). The coordinator is the
     one place that decides whether to actually send anything anywhere.
  */
  window.addEventListener('error', function(e){
    emit('slime:crash-report', {
      message: e.message || 'Unknown error',
      stack: (e.error && e.error.stack) || '',
      state: current.state
    });
  });
  window.addEventListener('unhandledrejection', function(e){
    var reason = e.reason;
    emit('slime:crash-report', {
      message: (reason && reason.message) || String(reason || 'Unhandled rejection'),
      stack: (reason && reason.stack) || '',
      state: current.state
    });
  });

  // Real-hardware finding (2026-08-08, UTM VM): the global 'error' handler
  // above is a necessary last-resort fallback, but under this page's
  // file:// origin, WPE WebKit redacts window.onerror's own message/stack
  // to the generic "Script error." for interactive-handler exceptions --
  // confirmed live (a real bug during Settings/Privacy tab testing reported
  // as bare "Script error." with no detail). A `catch` block's Error object
  // is never subject to that redaction -- it's a completely different
  // mechanism (no browser-level cross-origin error event involved) -- so
  // every interactive handler in bindScreen() goes through `on()` below
  // instead of raw addEventListener, to get real diagnostics.
  function reportCaughtError(err){
    try {
      emit('slime:crash-report', {
        message: (err && err.message) || String(err),
        stack: (err && err.stack) || '',
        state: current.state
      });
    } catch (e) { /* never let error reporting itself throw */ }
  }

  // Deliberately swallows (never rethrows): if it did, the error would
  // propagate up through the browser's normal event dispatch and ALSO
  // trigger the global 'error' listener above, double-reporting the same
  // failure -- one accurate (from here) and one generic "Script error."
  // (from there), inflating a single real bug into two GitHub issues.
  function guarded(handler){
    return function(e){
      try { return handler(e); }
      catch (err) { reportCaughtError(err); }
    };
  }

  function on(el, type, handler){
    el.addEventListener(type, guarded(handler));
  }

  /* ===================== mousedown -> click activation workaround =====================
     Real-hardware finding (2026-07-12, Gigabyte GA-78LMT-S2P, cage 0.2.0 +
     cog + WPE on trixie): mouse clicks on buttons/cards/icons never
     register at all, while native input-focus-on-click and keyboard Enter
     both work fine. Matches a known category of Wayland click-completion
     bugs (compositors must pair pointer-button events with a "frame"
     completion signal for a browser's `click` to fire -- see
     cage-kiosk/cage#305 and related wlroots seat/frame issues; cage 0.2.0
     is a much newer version than this repo's other comments were written
     against, so the exact bug surface has shifted). Patching cage/cog/
     wlroots upstream isn't practical here, so the page compensates itself:
     synthesize a `click` from `mousedown` after a short grace window, but
     only if a real `click` didn't already arrive -- so exactly one click
     fires whether or not the platform's own synthesis works. Verified
     this doesn't double-fire in a normal browser (demo mode); needs
     real-hardware confirmation that it actually fixes the reported bug.
  */
  var pendingClickEl = null;
  document.addEventListener('mousedown', function(e){
    var el = e.target.closest('button, [tabindex]');
    if (!el) return;
    pendingClickEl = el;
    setTimeout(function(){
      if (pendingClickEl === el){
        pendingClickEl = null;
        el.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }));
      }
    }, 200);
  }, true);
  document.addEventListener('click', function(){ pendingClickEl = null; }, true);

  /* ===================== status strip ===================== */

  // Newer version string from the backend's last do_update_check() (see
  // coordinator.sh/update.sh), or null if none -- kept independent of
  // `current.state` so a status message that arrives before/after a state
  // change doesn't race the icon's own visibility (see renderUpdateIcon,
  // called both from here and from render() below).
  var pendingUpdateVersion = null;

  function setStatus(opts){
    opts = opts || {};
    if (opts.clock){
      var parts = opts.clock.split(':');
      var d = new Date();
      d.setHours(parseInt(parts[0], 10) || 0, parseInt(parts[1], 10) || 0, 0, 0);
      clockDate = d;
      renderClock();
      if (!clockTimer){
        clockTimer = setInterval(function(){
          if (!clockDate) return;
          clockDate = new Date(clockDate.getTime() + 30000);
          renderClock();
        }, 30000);
      }
    }
    if (opts.tunnel){
      renderTunnel(opts.tunnel);
    }
    if ('update' in opts){
      pendingUpdateVersion = opts.update || null;
      renderUpdateIcon();
    }
  }

  // Shown only on the idle empty/picker screens, even though the backend
  // sends `update` on every setStatus call regardless of screen -- see
  // coordinator.sh's header comment on why 'applyUpdate' is only guaranteed
  // to reach the outer dispatch loop (and not be silently dropped by
  // whichever do_* currently owns read_event) from those two states.
  function renderUpdateIcon(){
    var btn = document.getElementById('btnUpdate');
    var idle = (current.state === 'empty' || current.state === 'picker');
    btn.classList.toggle('hidden', !(idle && pendingUpdateVersion));
  }

  function renderClock(){
    if (!clockDate) return;
    var pad = function(n){ return String(n).padStart(2, '0'); };
    document.getElementById('clockLabel').textContent = pad(clockDate.getHours()) + ':' + pad(clockDate.getMinutes());
  }

  var lastTunnel = 'down';
  function renderTunnel(tunnel){
    lastTunnel = tunnel;
    var dot = document.getElementById('tunnelDot');
    var label = document.getElementById('tunnelLabel');
    var color = tunnel === 'up' ? '#00FF87' : tunnel === 'connecting' ? '#5FE6D2' : '#56616f';
    var text = tunnel === 'up' ? 'Secure tunnel' : tunnel === 'connecting' ? 'Connecting\u2026' : 'Not connected';
    dot.style.background = color;
    dot.style.boxShadow = '0 0 6px ' + color;
    label.style.color = color;
    label.textContent = text;
    renderTunnelBars(tunnel);

    // Ping only runs while the tunnel is actually up -- no point timing a
    // request over a down/still-connecting tunnel. Purely client-side
    // (no coordinator.sh involvement, same as the clock's own 30s
    // setInterval above): times a no-cors fetch to the hub's power
    // service (10.10.0.1:7677/status, same read-only endpoint
    // refresh_brain_status() uses -- no auth, no side effects, always
    // reachable over the tunnel once wg0 is up) the same way the
    // marketing site's demo.astro / useLatency.ts measures its "EDGE"
    // indicator, so this reads as the same feature Tommy's used to.
    if (tunnel === 'up'){
      if (!tunnelPingTimer){
        measureTunnelPing();
        tunnelPingTimer = setInterval(measureTunnelPing, 5000);
      }
    } else if (tunnelPingTimer){
      clearInterval(tunnelPingTimer);
      tunnelPingTimer = null;
      tunnelPingMs = null;
    }
  }

  // Signal-strength icon instead of a numeric "·Xms" label -- lower latency
  // lights more bars, same idea as a phone's signal indicator. Thresholds
  // are a reasonable default (not measured against real-world Brain RTTs);
  // adjust here if they read wrong in practice.
  function tunnelBarLevel(tunnel, ms){
    if (tunnel !== 'up' || ms == null) return 0;
    if (ms < 80) return 3;
    if (ms < 200) return 2;
    if (ms < 400) return 1;
    return 0;
  }
  function renderTunnelBars(tunnel){
    var level = tunnelBarLevel(tunnel, tunnelPingMs);
    [1, 2, 3].forEach(function(n){
      document.getElementById('bar' + n).classList.toggle('lit', n <= level);
    });
  }

  var tunnelPingMs = null;
  var tunnelPingTimer = null;
  function measureTunnelPing(){
    var t0 = performance.now();
    fetch('http://10.10.0.1:7677/status', { mode: 'no-cors', cache: 'no-store' })
      .then(function(){
        tunnelPingMs = Math.round(performance.now() - t0);
        if (lastTunnel === 'up') renderTunnel('up');
      })
      .catch(function(){
        tunnelPingMs = null;
        if (lastTunnel === 'up') renderTunnel('up');
      });
  }

  /* ===================== rendering ===================== */

  // States that can render inside the tabbed Settings panel (gear icon) --
  // always exactly the states whose `data.mode === 'settings'` (supportSettings
  // has no other mode). SETTINGS_TOP_STATES additionally marks which of
  // those show the tab bar: the top-level screen of each tab, matching
  // exactly the states whose `back` handling (see each do_*() in the
  // coordinator) closes the panel entirely rather than stepping back one
  // level within the same tab.
  var SETTINGS_STATES = { wifiList:1, wifiPassword:1, wifiConnecting:1, wifiError:1, pairEntry:1, pairConnecting:1, pairError:1, speakerSettings:1, microphoneSettings:1, cameraSettings:1, supportSettings:1, crashReportSettings:1, timezoneSettings:1, changelogSettings:1 };
  var SETTINGS_TOP_STATES = { wifiList:1, pairEntry:1, speakerSettings:1, microphoneSettings:1, cameraSettings:1, supportSettings:1, crashReportSettings:1, timezoneSettings:1, changelogSettings:1 };
  // Left-hand nav, grouped. Was a flat horizontal row of tabs; with the
  // Devices group added it needed a sidebar with parent/child grouping.
  // Groups are always expanded -- see the .settings-sidebar CSS comment.
  var SETTINGS_NAV = [
    { group: 'Network', items: [ { id: 'internet', label: 'Wi-Fi & Internet' }, { id: 'pair', label: 'Pairing' } ] },
    { group: 'Devices', items: [ { id: 'speaker', label: 'Speaker' }, { id: 'microphone', label: 'Microphone' }, { id: 'camera', label: 'Camera' } ] },
    { group: 'Support', items: [ { id: 'support', label: 'Remote Support' }, { id: 'privacy', label: 'Privacy' } ] },
    { group: 'System', items: [ { id: 'timezone', label: 'Timezone' }, { id: 'changelog', label: 'Changelog' } ] }
  ];

  function settingsTabForState(state){
    if (state === 'pairEntry' || state === 'pairConnecting' || state === 'pairError') return 'pair';
    if (state === 'speakerSettings') return 'speaker';
    if (state === 'microphoneSettings') return 'microphone';
    if (state === 'cameraSettings') return 'camera';
    if (state === 'supportSettings') return 'support';
    if (state === 'crashReportSettings') return 'privacy';
    if (state === 'timezoneSettings') return 'timezone';
    if (state === 'changelogSettings') return 'changelog';
    return 'internet';
  }

  function renderSettingsShell(state, innerHtml){
    var activeTab = settingsTabForState(state);
    // Only the top-level screen of each tab shows the nav -- a half-done
    // wifi/pair sub-flow (wifiPassword, pairConnecting, ...) keeps it hidden
    // so `back` there steps within the flow rather than looking like it
    // should switch tabs. Same states as before, just a sidebar now.
    var showNav = !!SETTINGS_TOP_STATES[state];
    // wifiConnecting/pairConnecting are transient, no-button screens by
    // design (see their own render*() comments) -- no close affordance
    // there either, same reasoning.
    var showClose = state !== 'wifiConnecting' && state !== 'pairConnecting';
    var navHtml = SETTINGS_NAV.map(function(g){
      return '<div class="settings-nav-group">' +
        '<div class="settings-nav-label">' + g.group + '</div>' +
        g.items.map(function(t){
          return '<button type="button" class="settings-tab' + (t.id === activeTab ? ' active' : '') + '" data-tab="' + t.id + '">' + t.label + '</button>';
        }).join('') +
      '</div>';
    }).join('');
    return (
      '<div class="screen" data-screen="settings">' +
        '<div class="settings-panel">' +
          '<div class="settings-panel-header">' +
            '<h2 class="settings-title">Settings</h2>' +
            (showClose ? '<button type="button" class="settings-close" id="btnSettingsClose" title="Close" aria-label="Close">&times;</button>' : '') +
          '</div>' +
          (showNav
            ? '<div class="settings-shell"><div class="settings-sidebar">' + navHtml + '</div><div class="settings-body">' + innerHtml + '</div></div>'
            : '<div class="settings-body">' + innerHtml + '</div>') +
        '</div>' +
      '</div>'
    );
  }

  function bindSettingsShell(state){
    try { bindSettingsShellImpl(state); }
    catch (err) { reportCaughtError(err); }
  }

  function bindSettingsShellImpl(state){
    var close = document.getElementById('btnSettingsClose');
    if (close) on(close, 'click', function(){ emit('slime:back'); });
    Array.prototype.forEach.call(document.querySelectorAll('.settings-tab'), function(btn){
      on(btn, 'click', function(){
        var tab = btn.getAttribute('data-tab');
        if (tab !== settingsTabForState(state)) emit('slime:settings-tab', { tab: tab });
      });
    });
  }

  // Wrapped like guarded()'s handlers, same reasoning: a thrown error here
  // (e.g. malformed data from the backend) gets full-fidelity message/stack
  // via this catch instead of the generic global fallback -- swallow, don't
  // rethrow, so it isn't double-reported.
  function render(){
    try { renderImpl(); }
    catch (err) { reportCaughtError(err); }
    renderUpdateIcon();
  }

  // Signature of the last full render of the Camera tab (everything about it
  // EXCEPT the frame). While previewing, the backend re-emits cameraSettings
  // ~1x/sec with only a new frameDataUrl -- a full screenRoot re-render each
  // time visibly rebuilds the whole panel (sidebar, header, scroll pos) and
  // flickers. When only the frame changed, swap the <img src> in place.
  var lastCameraSig = null;

  function renderImpl(){
    var state = current.state, data = current.data || {};
    // See #tzDropdownRoot's own HTML comment: it's a floating overlay
    // outside the normal state-driven screenRoot tree, so it needs its
    // own explicit teardown on every re-render rather than getting wiped
    // for free by screenRoot.innerHTML being replaced below.
    document.getElementById('tzDropdownRoot').innerHTML = '';

    if (state === 'cameraSettings' && data.frameDataUrl){
      var camSig = 'a' + (data.available ? 1 : 0) + 'p' + (data.previewing ? 1 : 0) + 'e' + (data.error || '');
      var camImg = document.getElementById('hwCameraFrame');
      if (camImg && camImg.tagName === 'IMG' && camSig === lastCameraSig){
        camImg.src = data.frameDataUrl;
        return; // render() still runs renderUpdateIcon() after this
      }
      lastCameraSig = camSig;
    } else {
      lastCameraSig = null;
    }

    var html = '';
    if (state === 'empty') html = renderEmpty(data);
    else if (state === 'picker') html = renderPicker(data);
    else if (state === 'addBrain') html = renderAddBrain();
    else if (state === 'credentials') html = renderCredentials(data);
    else if (state === 'connecting') html = renderConnecting(data);
    else if (state === 'sessionActive') html = renderSessionActive(data);
    else if (state === 'error') html = renderError(data);
    else if (state === 'reconnecting') html = renderReconnecting(data);
    else if (state === 'disconnected') html = renderDisconnected();
    else if (state === 'wifiList') html = renderWifiList(data);
    else if (state === 'wifiPassword') html = renderWifiPassword(data);
    else if (state === 'wifiConnecting') html = renderWifiConnecting(data);
    else if (state === 'wifiError') html = renderWifiError(data);
    else if (state === 'pairEntry') html = renderPairEntry(data);
    else if (state === 'pairConnecting') html = renderPairConnecting(data);
    else if (state === 'pairError') html = renderPairError(data);
    else if (state === 'speakerSettings') html = renderSpeakerSettings(data);
    else if (state === 'microphoneSettings') html = renderMicrophoneSettings(data);
    else if (state === 'cameraSettings') html = renderCameraSettings(data);
    else if (state === 'supportSettings') html = renderSupportSettings(data);
    else if (state === 'timezoneSettings') html = renderTimezoneSettings(data);
    else if (state === 'crashReportSettings') html = renderCrashReportSettings(data);
    else if (state === 'changelogSettings') html = renderChangelogSettings(data);
    else if (state === 'slimeIdConnecting') html = renderSlimeIdConnecting(data);
    else if (state === 'slimeIdEntry') html = renderSlimeIdEntry(data);
    else if (state === 'slimeIdError') html = renderSlimeIdError(data);

    var isSettingsPanel = SETTINGS_STATES[state] && data.mode === 'settings';
    if (isSettingsPanel) html = renderSettingsShell(state, html);

    screenRoot.innerHTML = html;
    bindScreen(state, data);
    if (isSettingsPanel) bindSettingsShell(state);
    autofocus(state);
  }

  function renderEmpty(data){
    return (
      '<div class="screen" data-screen="empty">' +
        '<span style="display:inline-block;animation:blobFloat 6s ease-in-out infinite;">' + slimeBlobSVG(96, 'color', true) + '</span>' +
        '<h1 class="title">Welcome to Slime OS</h1>' +
        '<p class="subtitle">Your Brain is a computer in the cloud that does the heavy lifting. Add one so this machine can connect to it.</p>' +
        '<button class="btn-primary" style="margin-top:36px;" id="btnAddBrain" data-autofocus>Add a Brain</button>' +
        (data.signedInEmail
          ? (
              '<p class="btn-ghost" style="margin-top:22px;margin-bottom:0;cursor:default;">Signed in as ' + escapeHtml(maskEmail(data.signedInEmail)) + '</p>' +
              '<button class="btn-ghost" style="padding:4px 8px;" id="btnSlimeIdLogout">Sign out</button>'
            )
          : '<button class="btn-ghost" style="margin-top:22px;" id="btnSlimeId">Sign in with Slime ID</button>') +
      '</div>'
    );
  }

  function renderPicker(data){
    var brains = data.brains || [];
    var cards = brains.map(function(b, i){
      var accent = ACCENTS[i % ACCENTS.length];
      var initial = (b.name || '?').trim().charAt(0).toUpperCase() || '?';
      var isRemote = !!b.remote;
      // Quiet default: "online"/"unknown" get no badge at all, matching
      // how the Slime ID bookmark badge above only appears for the
      // exceptional case. Local/paired brains only -- remote bookmark
      // cards keep their own existing "Tap to reconnect" affordance.
      var statusBadge = '';
      if (!isRemote && (b.status === 'asleep' || b.status === 'offline')) {
        statusBadge = ' <span class="brain-status-badge ' + b.status + '">' + (b.status === 'asleep' ? 'Asleep' : 'Offline') + '</span>';
      }
      return (
        '<div class="brain-card' + (isRemote ? ' brain-card-bookmark' : '') + '" tabindex="0" role="listitem" data-brain-id="' + escapeHtml(b.id) + '"' + (i === 0 ? ' data-autofocus="1"' : '') + '>' +
          '<div class="brain-row">' +
            '<div class="brain-id">' +
              '<span class="brain-avatar" style="background:' + accent + ';">' + escapeHtml(initial) + '</span>' +
              '<div style="min-width:0;">' +
                '<div class="brain-name">' + escapeHtml(b.name) + (isRemote ? ' <span class="brain-bookmark-badge">Slime ID</span>' : statusBadge) + '</div>' +
                '<div class="brain-host">' + escapeHtml(b.host) + '</div>' +
              '</div>' +
            '</div>' +
            (isRemote ? '' : '<button class="brain-remove" title="Remove" data-remove-id="' + escapeHtml(b.id) + '">&times;</button>') +
          '</div>' +
          '<div class="brain-meta">' +
            (isRemote
              ? '<span class="last">Not paired on this device</span>'
              : '<span class="last">Last connected ' + escapeHtml(b.lastConnected || 'never') + '</span>') +
            '<span class="connect">' + (isRemote ? 'Tap to reconnect &rarr;' : 'Connect &rarr;') + '</span>' +
          '</div>' +
        '</div>'
      );
    }).join('');
    return (
      '<div class="screen" data-screen="picker">' +
        slimeBlobSVG(52, 'color', false) +
        '<h1 style="margin:20px 0 4px;font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:-.4px;color:#F2F6FB;">Choose a Brain</h1>' +
        '<p style="margin:0 0 32px;font-size:13.5px;color:var(--text-muted);">Press Enter on a card to connect</p>' +
        '<div class="picker-list" id="pickerList" role="list">' +
          cards +
          '<div class="add-card" id="btnAddBrainCard" tabindex="0" data-autofocus="' + (brains.length ? '0' : '1') + '">' +
            '<span style="font-size:20px;line-height:1;">+</span>' +
            '<span style="font-family:var(--font-display);font-weight:600;font-size:14.5px;">Add a Brain</span>' +
          '</div>' +
        '</div>' +
        (data.signedInEmail
          ? (
              '<p class="btn-ghost" style="margin-top:38px;margin-bottom:0;cursor:default;">Signed in as ' + escapeHtml(maskEmail(data.signedInEmail)) + '</p>' +
              '<button class="btn-ghost" style="padding:4px 8px;" id="btnSlimeIdLogout2">Sign out</button>'
            )
          : '<button class="btn-ghost" style="margin-top:38px;" id="btnSlimeId2">Sign in with Slime ID</button>') +
      '</div>'
    );
  }

  function renderAddBrain(){
    return (
      '<div class="screen" data-screen="addBrain">' +
        '<form class="card" id="addBrainForm" novalidate>' +
          '<h2 class="title">Add a Brain</h2>' +
          '<p style="margin:0 0 26px;font-size:13.5px;color:var(--text-muted);">Enter its name and address to connect.</p>' +
          '<label class="field-label">Name</label>' +
          '<input class="field" id="fieldName" placeholder="e.g. Home Office" data-autofocus>' +
          '<label class="field-label">Address</label>' +
          '<input class="field" id="fieldHost" placeholder="IP address or hostname" style="margin-bottom:0;">' +
          '<div id="hostError" style="min-height:22px;margin-top:8px;font-size:12.5px;color:var(--error);"></div>' +
          '<button type="button" class="btn-ghost" id="btnAdvanced" style="padding:4px 0;margin-top:8px;">+ Advanced (port)</button>' +
          '<div id="advancedPanel" class="hidden" style="margin-top:12px;">' +
            '<label class="field-label">Port</label>' +
            '<input class="field" id="fieldPort" value="3389" style="margin-bottom:0;font-family:var(--font-mono);width:120px;">' +
          '</div>' +
          '<div style="display:flex;gap:10px;margin-top:30px;">' +
            '<button type="button" class="btn-secondary" style="flex:1;" id="btnCancelAdd">Cancel</button>' +
            '<button type="submit" class="btn-primary" style="flex:1.4;padding:12px;box-shadow:none;">Continue</button>' +
          '</div>' +
        '</form>' +
      '</div>'
    );
  }

  function renderCredentials(data){
    var needUsername = data.needUsername !== false;
    return (
      '<div class="screen" data-screen="credentials">' +
        '<form class="card" id="credentialsForm" novalidate>' +
          '<h2 class="title">Who signs in on ' + escapeHtml(data.brainName || 'your Brain') + '?</h2>' +
          '<p style="margin:0 0 26px;font-size:13.5px;color:var(--text-muted);">We\u2019ll remember this, stored securely on this device.</p>' +
          (needUsername ? (
            '<label class="field-label">Username</label>' +
            '<input class="field" id="fieldUsername" placeholder="e.g. jane" data-autofocus>'
          ) : '') +
          '<label class="field-label">Password</label>' +
          '<div style="position:relative;">' +
            '<input class="field" type="password" id="fieldPassword" placeholder="Password" style="padding-right:52px;" ' + (needUsername ? '' : 'data-autofocus') + '>' +
            '<button type="button" id="btnTogglePw" style="position:absolute;right:6px;top:11px;background:none;border:none;color:#7d8a9a;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.5px;padding:6px 8px;">SHOW</button>' +
          '</div>' +
          '<div style="display:flex;gap:10px;margin-top:8px;">' +
            '<button type="button" class="btn-secondary" style="flex:1;" id="btnBackFromCreds">Back</button>' +
            '<button type="submit" class="btn-primary" style="flex:1.4;padding:12px;box-shadow:none;">Connect</button>' +
          '</div>' +
        '</form>' +
      '</div>'
    );
  }

  function renderConnecting(data){
    return (
      '<div class="screen" data-screen="connecting">' +
        '<div class="ring-wrap">' +
          '<span class="ring"></span><span class="ring inner"></span>' +
          slimeBlobSVG(66, 'color', false) +
        '</div>' +
        '<h2 style="margin:30px 0 0;font-family:var(--font-display);font-weight:700;font-size:21px;color:#F2F6FB;">' + escapeHtml(data.brainName || 'your Brain') + '</h2>' +
        '<p style="margin:12px 0 0;font-size:14.5px;color:var(--mint);font-family:var(--font-mono);">' + escapeHtml(data.stage || STAGE_FALLBACK) + '</p>' +
        '<button class="btn-secondary" style="margin-top:34px;padding:11px 22px;font-size:13.5px;" id="btnCancelConnect" data-autofocus>Cancel</button>' +
      '</div>'
    );
  }

  // Shown for the entire duration of an active RDP session -- xfreerdp3's
  // own window is what's actually on screen this whole time (see the
  // emit_state sessionActive comment in connect.sh), so this deliberately
  // has NO infinite CSS animation (unlike renderConnecting's spinning
  // ring, which used to stay in the DOM -- and running -- for the whole
  // session because nothing ever transitioned away from it).
  function renderSessionActive(data){
    return (
      '<div class="screen" data-screen="sessionActive">' +
        slimeBlobSVG(66, 'color', false) +
        '<h2 style="margin:20px 0 0;font-family:var(--font-display);font-weight:700;font-size:21px;color:#F2F6FB;">' + escapeHtml(data.brainName || 'your Brain') + '</h2>' +
        '<p style="margin:12px 0 0;font-size:14.5px;color:var(--mint);font-family:var(--font-mono);">Session active</p>' +
        '<button class="btn-secondary" style="margin-top:34px;padding:11px 22px;font-size:13.5px;" id="btnCancelConnect">Disconnect</button>' +
      '</div>'
    );
  }

  function renderError(data){
    // hideReenterPassword: set for a rejected server-delivered credential
    // (kind='paid' Brain) -- a human never typed that password, so a
    // "Re-enter password" button implies an action they can't take. Every
    // other emit_state error caller leaves this unset/falsy, so the button
    // still renders as before everywhere else.
    var showReenter = !data.hideReenterPassword;
    return (
      '<div class="screen" data-screen="error">' +
        '<div class="error-card">' +
          '<span class="error-icon">!</span>' +
          '<h2 style="margin:20px 0 0;font-family:var(--font-display);font-weight:700;font-size:19px;color:#F2F6FB;">' + escapeHtml(data.message || 'Something went wrong.') + '</h2>' +
          '<p style="margin:10px 0 0;font-size:13.5px;line-height:1.6;color:var(--text-muted);">' + escapeHtml(data.brainName ? ('Couldn\u2019t connect to ' + data.brainName + '.') : '') + '</p>' +
          '<div class="error-actions">' +
            '<button class="btn-primary" style="box-shadow:none;" id="btnTryAgain" data-autofocus>Try again</button>' +
            (showReenter ? '<button class="btn-secondary" id="btnReenterPassword">Re-enter password</button>' : '') +
            '<button class="btn-tertiary" id="btnBackFromError">Back to Brain list</button>' +
          '</div>' +
          '<details class="tech"><summary>+ Technical details</summary><div class="code">' + escapeHtml(data.detail || '') + '</div></details>' +
        '</div>' +
      '</div>'
    );
  }

  function renderReconnecting(data){
    return (
      '<div class="screen" data-screen="reconnecting">' +
        '<div class="reconnect-panel">' +
          '<span class="spinner"></span>' +
          '<h2 style="margin:18px 0 0;font-family:var(--font-display);font-weight:600;font-size:17px;color:#F2F6FB;">Connection lost &mdash; reconnecting&hellip;</h2>' +
          '<p style="margin:8px 0 0;font-size:12.5px;font-family:var(--font-mono);color:var(--text-muted);">Attempt ' + escapeHtml(data.attempt || 1) + '</p>' +
          '<button class="btn-tertiary" style="color:var(--mint);margin-top:20px;" id="btnBackFromReconnect" data-autofocus>Back to Brain list</button>' +
        '</div>' +
      '</div>'
    );
  }

  function renderDisconnected(){
    // No buttons: nothing could route an event anywhere while the WS
    // bridge itself is down, so a button here would render but silently
    // no-op — more confusing than a plain non-interactive placeholder.
    return (
      '<div class="screen" data-screen="disconnected">' +
        '<div class="reconnect-panel">' +
          '<span class="spinner"></span>' +
          '<h2 style="margin:18px 0 0;font-family:var(--font-display);font-weight:600;font-size:17px;color:#F2F6FB;">Reconnecting to Slime OS&hellip;</h2>' +
        '</div>' +
      '</div>'
    );
  }

  function renderWifiList(data){
    var networks = data.networks || [];
    var mode = data.mode || 'boot';
    var rows = networks.map(function(n, i){
      var badgeColor = n.secured ? '#4FACFE' : '#00FF87';
      var badgeGlyph = n.secured ? '🔒' : '○';
      return (
        '<div class="brain-card wifi-item" tabindex="0" role="listitem" data-ssid="' + escapeHtml(n.ssid) + '"' + (i === 0 ? ' data-autofocus="1"' : '') + '>' +
          '<div class="brain-row">' +
            '<div class="brain-id">' +
              '<span class="brain-avatar" style="background:' + badgeColor + ';font-size:14px;">' + badgeGlyph + '</span>' +
              '<div style="min-width:0;">' +
                '<div class="brain-name">' + escapeHtml(n.ssid) + '</div>' +
                '<div class="brain-host">' + (n.secured ? 'Secured' : 'Open') + (n.signal != null ? (' &middot; signal ' + escapeHtml(n.signal) + '%') : '') + '</div>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>'
      );
    }).join('');
    var emptyMsg = !networks.length ? ('<p style="font-size:13.5px;color:var(--text-muted);">' + (data.scanning ? 'Scanning for networks…' : 'No networks found nearby.') + '</p>') : '';
    var actions = (
      '<button class="btn-ghost"' + (!networks.length ? ' data-autofocus' : '') + ' id="btnWifiRescan">Rescan</button>' +
      (mode === 'boot' && data.skippable ? '<button class="btn-ghost" id="btnWifiSkip">Skip &middot; my network already works</button>' : '') +
      (mode === 'settings' ? '<button class="btn-ghost" id="btnWifiBack">Back</button>' : '')
    );
    return (
      '<div class="screen" data-screen="wifiList">' +
        slimeBlobSVG(52, 'color', false) +
        '<h1 style="margin:20px 0 4px;font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:-.4px;color:#F2F6FB;">Connect to Wi-Fi</h1>' +
        '<p style="margin:0 0 24px;font-size:13.5px;color:var(--text-muted);">' + (
          data.connectionType === 'ethernet' ? 'Ethernet is connected — switch Wi-Fi networks below.' :
          data.connectionType === 'wifi' ? ('Connected to ' + escapeHtml(data.connectionSsid || 'Wi-Fi') + ' — switch networks below.') :
          'This device needs a network to reach your Brain.'
        ) + '</p>' +
        '<div class="picker-list" id="wifiListRoot" role="list">' + rows + '</div>' +
        emptyMsg +
        '<div style="display:flex;gap:14px;margin-top:28px;">' + actions + '</div>' +
      '</div>'
    );
  }

  function renderWifiPassword(data){
    return (
      '<div class="screen" data-screen="wifiPassword">' +
        '<form class="card" id="wifiPasswordForm" novalidate>' +
          '<h2 class="title">Password for ' + escapeHtml(data.ssid || 'this network') + '</h2>' +
          '<p style="margin:0 0 26px;font-size:13.5px;color:var(--text-muted);">Stored securely on this device.</p>' +
          '<label class="field-label">Password</label>' +
          '<div style="position:relative;">' +
            '<input class="field" type="password" id="fieldWifiPassword" placeholder="Password" style="padding-right:52px;" data-autofocus>' +
            '<button type="button" id="btnToggleWifiPw" style="position:absolute;right:6px;top:11px;background:none;border:none;color:#7d8a9a;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.5px;padding:6px 8px;">SHOW</button>' +
          '</div>' +
          '<div style="display:flex;gap:10px;margin-top:8px;">' +
            '<button type="button" class="btn-secondary" style="flex:1;" id="btnBackFromWifiPw">Back</button>' +
            '<button type="submit" class="btn-primary" style="flex:1.4;padding:12px;box-shadow:none;">Connect</button>' +
          '</div>' +
        '</form>' +
      '</div>'
    );
  }

  function renderWifiConnecting(data){
    return (
      '<div class="screen" data-screen="wifiConnecting">' +
        '<div class="ring-wrap">' +
          '<span class="ring"></span><span class="ring inner"></span>' +
          slimeBlobSVG(66, 'color', false) +
        '</div>' +
        '<h2 style="margin:30px 0 0;font-family:var(--font-display);font-weight:700;font-size:21px;color:#F2F6FB;">' + escapeHtml(data.ssid || 'Wi-Fi') + '</h2>' +
        '<p style="margin:12px 0 0;font-size:14.5px;color:var(--mint);font-family:var(--font-mono);">' + escapeHtml(data.stage || 'Connecting…') + '</p>' +
      '</div>'
    );

  function renderWifiError(data){
    return (
      '<div class="screen" data-screen="wifiError">' +
        '<div class="error-card">' +
          '<span class="error-icon">!</span>' +
          '<h2 style="margin:20px 0 0;font-family:var(--font-display);font-weight:700;font-size:19px;color:#F2F6FB;">' + escapeHtml(data.message || 'Couldn’t connect.') + '</h2>' +
          '<p style="margin:10px 0 0;font-size:13.5px;line-height:1.6;color:var(--text-muted);">' + escapeHtml(data.ssid || '') + '</p>' +
          '<div class="error-actions">' +
            '<button class="btn-primary" style="box-shadow:none;" id="btnWifiTryAgain" data-autofocus>Try again</button>' +
            (data.secured ? '<button class="btn-secondary" id="btnWifiReenterPassword">Re-enter password</button>' : '') +
            '<button class="btn-tertiary" id="btnBackFromWifiError">Back to networks</button>' +
          '</div>' +
          '<details class="tech"><summary>+ Technical details</summary><div class="code">' + escapeHtml(data.detail || '') + '</div></details>' +
        '</div>' +
      '</div>'
    );
  }

  function renderPairEntry(data){
    var skippable = !!data.skippable;
    var mode = data.mode || 'boot';
    var hint = data.hint || '';
    return (
      '<div class="screen" data-screen="pairEntry">' +
        '<form class="card" id="pairEntryForm" novalidate>' +
          '<h2 class="title">Pair with a Brain</h2>' +
          (hint
            ? '<p style="margin:0 0 12px;font-size:13px;color:var(--mint);">' + escapeHtml(hint) + '</p>'
            : '') +
          '<p style="margin:0 0 26px;font-size:13.5px;color:var(--text-muted);">Enter the enrollment address and the code your admin gave you.</p>' +
          '<label class="field-label">Enrollment host</label>' +
          '<input class="field" id="fieldPairHost" placeholder="e.g. enroll.slimeos.com" data-autofocus>' +
          '<label class="field-label">Pairing code</label>' +
          '<input class="field" id="fieldPairCode" placeholder="XXXX-XXXX" style="margin-bottom:0;font-family:var(--font-mono);text-transform:uppercase;">' +
          '<div id="pairHostError" style="min-height:22px;margin-top:8px;font-size:12.5px;color:var(--error);"></div>' +
          '<div style="display:flex;gap:10px;margin-top:22px;">' +
            (mode === 'settings' ? '<button type="button" class="btn-secondary" style="flex:1;" id="btnBackFromPair">Back</button>' : '') +
            (mode === 'boot' && skippable ? '<button type="button" class="btn-ghost" style="flex:1;" id="btnPairSkip">Skip for now</button>' : '') +
            '<button type="submit" class="btn-primary" style="flex:1.4;padding:12px;box-shadow:none;">Pair</button>' +
          '</div>' +
        '</form>' +
      '</div>'
    );
  }

  function renderPairConnecting(data){
    return (
      '<div class="screen" data-screen="pairConnecting">' +
        '<div class="ring-wrap">' +
          '<span class="ring"></span><span class="ring inner"></span>' +
          slimeBlobSVG(66, 'color', false) +
        '</div>' +
        '<h2 style="margin:30px 0 0;font-family:var(--font-display);font-weight:700;font-size:21px;color:#F2F6FB;">Pairing</h2>' +
        '<p style="margin:12px 0 0;font-size:14.5px;color:var(--mint);font-family:var(--font-mono);">' + escapeHtml(data.stage || 'Fetching your Brain’s configuration…') + '</p>' +

  function renderPairError(data){
    return (
      '<div class="screen" data-screen="pairError">' +
        '<div class="error-card">' +
          '<span class="error-icon">!</span>' +
          '<h2 style="margin:20px 0 0;font-family:var(--font-display);font-weight:700;font-size:19px;color:#F2F6FB;">' + escapeHtml(data.message || 'Couldn’t pair.') + '</h2>' +
          '<div class="error-actions">' +
            '<button class="btn-primary" style="box-shadow:none;" id="btnPairTryAgain" data-autofocus>Try again</button>' +
            '<button class="btn-tertiary" id="btnBackFromPairError">Back</button>' +
          '</div>' +
          '<details class="tech"><summary>+ Technical details</summary><div class="code">' + escapeHtml(data.detail || '') + '</div></details>' +

      '</div>'

  // Speaker / Microphone / Camera tabs -- all LOCAL hardware checks, no
  // Brain involved (see membrane/session/hardware-test.sh). Modeled on
  // renderSupportSettings/renderTimezoneSettings: heading + blurb + a
  // narrow control column, restrained empty states when the device isn't
  // there.
  function renderHwSettingsFrame(screen, title, blurb, inner){
    return (
      '<div class="screen" data-screen="' + screen + '">' +
        '<div style="width:100%;max-width:460px;">' +
          '<h2 class="title" style="text-align:left;font-size:19px;margin:0 0 8px;">' + title + '</h2>' +
          '<p style="margin:0 0 20px;font-size:13.5px;line-height:1.65;color:var(--text-muted);">' + blurb + '</p>' +
          inner +
        '</div>' +
      '</div>'
    );
  }

  function renderHwVolumeControl(idPrefix, volume){
    // No usable mixer control -- show nothing rather than a dead slider.
    if (volume == null) return '';
    var v = Math.max(0, Math.min(100, volume | 0));
    return (
      '<label class="field-label">Volume</label>' +
      '<div class="hw-slider-row">' +
        '<input type="range" min="0" max="100" step="1" value="' + v + '" class="hw-slider" id="field' + idPrefix + 'Volume">' +
        '<span class="hw-slider-value" id="hw' + idPrefix + 'VolumeValue">' + v + '%</span>' +
      '</div>'
    );
  }

  function renderSpeakerSettings(data){
    var inner;
    if (!data.card){
      inner = '<p style="font-size:13px;color:var(--text-dim);">' + escapeHtml(data.error || 'No speaker detected on this device.') + '</p>';
    } else {
      inner =
        renderHwVolumeControl('Speaker', data.volume) +
        '<button type="button" class="btn-secondary" id="btnSpeakerTest" style="margin-top:8px;">Play test sound</button>' +
        '<p class="hw-status' + (data.error ? ' err' : '') + '" id="hwSpeakerStatus">' + escapeHtml(data.error || '') + '</p>';
    }
    return renderHwSettingsFrame('speakerSettings', 'Speaker',
      'Set the output volume and play a short test tone. This is your Membrane’s own speaker — a Brain session has its own separate volume.',
      inner);
  }

  function renderMicrophoneSettings(data){
    var inner;
    if (!data.card){
      inner = '<p style="font-size:13px;color:var(--text-dim);">' + escapeHtml(data.error || 'No microphone detected on this device.') + '</p>';
    } else {
      var status = '', cls = '';
      if (data.testing){ status = 'Recording 3 seconds, then playing it back…'; }
      else if (data.testResult === 'ok'){ status = 'Recorded and played back cleanly — the microphone works.'; cls = ' ok'; }
      else if (data.error){ status = data.error; cls = ' err'; }
      inner =
        renderHwVolumeControl('Mic', data.volume) +
        '<button type="button" class="btn-secondary" id="btnMicTest" style="margin-top:8px;"' + (data.testing ? ' disabled' : '') + '>Test microphone</button>' +
        '<p class="hw-status' + cls + '" id="hwMicStatus">' + escapeHtml(status) + '</p>';
    }
    return renderHwSettingsFrame('microphoneSettings', 'Microphone',
      'Set the input level and run a quick check: it records three seconds from the mic and plays it straight back on the speaker.',
      inner);
  }

  function renderCameraSettings(data){
    var inner;
    if (!data.available){
      inner = '<div class="hw-camera-placeholder">' + escapeHtml(data.error || 'No camera detected on this device.') + '</div>';
    } else {
      var previewing = !!data.previewing;
      inner =
        (data.frameDataUrl
          ? '<img class="hw-camera-frame" id="hwCameraFrame" alt="Camera preview" src="' + data.frameDataUrl + '">'
          : '<div class="hw-camera-placeholder" id="hwCameraFrame">' + (previewing ? 'Starting preview…' : 'Preview is off.') + '</div>') +
        '<button type="button" class="btn-secondary" id="btnCameraPreview" style="margin-top:12px;">' +
          (previewing ? 'Stop preview' : 'Start preview') +
        '</button>' +
        '<p style="margin:12px 0 0;font-size:11.5px;color:var(--text-faint);">The preview refreshes about once a second — that’s just how this check works, not a fault with the camera. Inside a Brain session the video is full-speed.</p>' +
        '<p class="hw-status' + (data.error ? ' err' : '') + '" id="hwCameraStatus">' + escapeHtml(data.error || '') + '</p>';
    }
    return renderHwSettingsFrame('cameraSettings', 'Camera',
      'Show a preview from the webcam so you can confirm it’s working and pointed the right way, before a Brain session ever uses it.',
      inner);
  }

  function renderSupportSettings(data){
    var enabled = !!data.enabled;
    var conn = data.connection;
    var error = data.error;
    return (
      '<div class="screen" data-screen="supportSettings">' +
        '<div style="width:100%;max-width:460px;">' +
          '<h2 class="title" style="text-align:left;font-size:19px;margin:0 0 8px;">Remote Support</h2>' +
          '<p style="margin:0 0 20px;font-size:13.5px;line-height:1.65;color:var(--text-muted);">Let the Slime OS support team connect to this device over SSH to help troubleshoot. Off by default, and reachable only over the WireGuard tunnel — the access details below change every time you switch this on.</p>' +
          '<div class="support-toggle-row" id="rowSupportToggle" role="switch" tabindex="0" data-autofocus aria-checked="' + (enabled ? 'true' : 'false') + '">' +
            '<input type="checkbox" id="fieldSupportToggle" tabindex="-1" aria-hidden="true"' + (enabled ? ' checked' : '') + '>' +
            '<span id="lblSupportToggle" style="font-family:var(--font-display);font-weight:600;font-size:14.5px;color:var(--text);">Remote Support is ' + (enabled ? 'on' : 'off') + '</span>' +
          '</div>' +
          (error ? '<p style="margin:14px 0 0;font-size:12.5px;color:var(--error);">' + escapeHtml(error) + '</p>' : '') +
          (enabled && conn ? (
            '<div class="support-connection">' +
              '<div class="field-label" style="margin-bottom:12px;">Share with support</div>' +
              '<dl>' +
                '<dt>Host</dt><dd>' + escapeHtml(conn.host || 'unknown') + '</dd>' +
                '<dt>Port</dt><dd>' + escapeHtml(conn.port || 22) + '</dd>' +
                '<dt>User</dt><dd>' + escapeHtml(conn.username || '') + '</dd>' +
                '<dt>Password</dt><dd>' + escapeHtml(conn.password || '') + '</dd>' +
              '</dl>' +
              '<p style="margin:14px 0 0;font-size:11.5px;color:var(--text-faint);">This password stops working the moment Remote Support is turned off — or back on, which replaces it with a new one.</p>' +
            '</div>'
          ) : '') +
          '<p style="margin:24px 0 0;font-size:11.5px;color:var(--text-faint);">Membrane v' + escapeHtml(data.version || 'unknown') + '</p>' +
        '</div>' +
      '</div>'
    );
  }

  function renderTimezoneSettings(data){
    var current = data.current || 'UTC';
    var error = data.error;
    return (
      '<div class="screen" data-screen="timezoneSettings">' +
        '<div style="width:100%;max-width:460px;">' +
          '<h2 class="title" style="text-align:left;font-size:19px;margin:0 0 8px;">Timezone</h2>' +
          '<p style="margin:0 0 20px;font-size:13.5px;line-height:1.65;color:var(--text-muted);">Sets this Membrane’s clock and timestamps. Doesn’t affect the time inside a Brain session, which keeps its own timezone.</p>' +
          '<label class="field-label">Timezone</label>' +
          '<div class="tz-combobox" id="tzCombobox">' +
            '<input class="field" id="fieldTimezone" autocomplete="off" spellcheck="false" data-autofocus value="' + escapeHtml(current) + '" placeholder="Type to search…" style="margin-bottom:0;">' +
          '</div>' +
          (error ? '<p style="margin:14px 0 0;font-size:12.5px;color:var(--error);">' + escapeHtml(error) + '</p>' : '') +
        '</div>' +
      '</div>'
    );
  }

  function renderCrashReportSettings(data){
    var enabled = !!data.enabled;
    return (
      '<div class="screen" data-screen="crashReportSettings">' +
        '<div style="width:100%;max-width:460px;">' +
          '<h2 class="title" style="text-align:left;font-size:19px;margin:0 0 8px;">Privacy</h2>' +
          '<p style="margin:0 0 20px;font-size:13.5px;line-height:1.65;color:var(--text-muted);">Automatically send anonymous error reports to help us fix bugs faster. No personal data, network details, or anything you’ve typed is ever included.</p>' +
          '<div class="support-toggle-row" id="rowCrashReportToggle" role="switch" tabindex="0" data-autofocus aria-checked="' + (enabled ? 'true' : 'false') + '">' +
            '<input type="checkbox" id="fieldCrashReportToggle" tabindex="-1" aria-hidden="true"' + (enabled ? ' checked' : '') + '>' +
            '<span id="lblCrashReportToggle" style="font-family:var(--font-display);font-weight:600;font-size:14.5px;color:var(--text);">Anonymous error reporting is ' + (enabled ? 'on' : 'off') + '</span>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  // Read-only, no fields/toggles -- shows what changed in the version
  // CURRENTLY INSTALLED (see changelog.sh's own header comment on why this
  // can differ from whatever's newest on `main`). white-space:pre-wrap
  // preserves the manifest's own line breaks without needing any markdown
  // rendering.
  function renderChangelogSettings(data){
    // releasedRelative is null on a device that predates this field, or a
    // manifest that never set released_at -- omit it entirely rather than
    // showing a confusing "released never". Inline with the version
    // heading (not its own block) so presence/absence never affects the
    // surrounding spacing.
    var releasedSuffix = data.releasedRelative
      ? ' <span style="color:var(--text-faint);font-weight:400;text-transform:none;letter-spacing:0;">— released ' + escapeHtml(data.releasedRelative) + '</span>'
      : '';
    return (
      '<div class="screen" data-screen="changelogSettings">' +
        '<div style="width:100%;max-width:460px;">' +
          '<h2 class="title" style="text-align:left;font-size:19px;margin:0 0 8px;">Changelog</h2>' +
          '<p style="margin:0 0 20px;font-size:13.5px;line-height:1.65;color:var(--text-muted);">What changed in the version currently installed on this device.</p>' +
          '<div class="support-connection">' +
            '<div class="field-label" style="margin-bottom:12px;">Slime OS v' + escapeHtml(data.version || 'unknown') + releasedSuffix + '</div>' +
            '<p style="margin:0;font-size:13px;line-height:1.7;color:var(--text);white-space:pre-wrap;">' + escapeHtml(data.changelog || 'No changelog recorded for this install.') + '</p>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  function renderSlimeIdConnecting(data){
    return (
      '<div class="screen" data-screen="slimeIdConnecting">' +
        '<div class="ring-wrap">' +
          '<span class="ring"></span><span class="ring inner"></span>' +
          slimeBlobSVG(66, 'color', false) +
        '</div>' +
        '<h2 style="margin:30px 0 0;font-family:var(--font-display);font-weight:700;font-size:21px;color:#F2F6FB;">Slime ID</h2>' +
        '<p style="margin:12px 0 0;font-size:14.5px;color:var(--mint);font-family:var(--font-mono);">' + escapeHtml(data.stage || 'Preparing sign-in…') + '</p>' +
      '</div>'
    );
  }

  function renderSlimeIdEntry(data){
    var userCode = data.userCode || '';
    var displayCode = userCode.length === 8 ? (userCode.slice(0, 4) + '-' + userCode.slice(4)) : userCode;
    return (
      '<div class="screen" data-screen="slimeIdEntry">' +
        '<div style="width:100%;max-width:380px;text-align:center;">' +
          '<h2 class="title" style="font-size:22px;margin:0 0 8px;">Sign in with Slime ID</h2>' +
          '<p style="margin:0 0 24px;font-size:13.5px;line-height:1.6;color:var(--text-muted);">Scan this code with your phone, or visit ' + escapeHtml(data.verificationUri || '') + ' and enter the code below.</p>' +
          '<div style="background:#fff;border-radius:16px;padding:16px;display:inline-block;margin-bottom:22px;">' +
            '<img src="' + escapeHtml(data.qrDataUrl || '') + '" alt="QR code" style="display:block;width:180px;height:180px;">' +
          '</div>' +
          '<p style="margin:0 0 22px;font-family:var(--font-mono);font-size:26px;font-weight:700;letter-spacing:3px;color:var(--mint);">' + escapeHtml(displayCode) + '</p>' +
          '<div style="display:flex;align-items:center;justify-content:center;gap:8px;color:var(--text-dim);font-size:12.5px;">' +
            '<span class="spinner" style="width:14px;height:14px;border-width:2px;"></span>' +
            '<span>Waiting for approval…</span>' +
          '</div>' +
          '<button class="btn-tertiary" style="margin-top:26px;" id="btnSlimeIdBack" data-autofocus>Back</button>' +
        '</div>' +
      '</div>'
    );
  }

  function renderSlimeIdError(data){
    return (
      '<div class="screen" data-screen="slimeIdError">' +
        '<div class="error-card">' +
          '<span class="error-icon">!</span>' +

            '<button class="btn-primary" style="box-shadow:none;" id="btnSlimeIdTryAgain" data-autofocus>Try again</button>' +
            '<button class="btn-tertiary" id="btnBackFromSlimeIdError">Back</button>' +
          '</div>' +
          '<details class="tech"><summary>+ Technical details</summary><div class="code">' + escapeHtml(data.detail || '') + '</div></details>' +
        '</div>' +
      '</div>'
    );

  /* ===================== event binding ===================== */

  // Wrapped like render(): setup-time errors (e.g. a missing element) get
  // full-fidelity reporting via this catch instead of the generic global
  // fallback. Every listener registered inside bindScreenImpl uses on()/
  // guarded() so errors raised LATER, when the user actually interacts,
  // are equally well-diagnosed (this outer try/catch only covers binding
  // itself, not events that fire afterward).
  function bindScreen(state, data){
    try { bindScreenImpl(state, data); }
    catch (err) { reportCaughtError(err); }
  }

  // Shared by the Speaker/Microphone tabs (hardware-test.sh): live-update
  // the "NN%" readout while dragging, but only emit the set event on
  // release ('change') so a drag across the track isn't hundreds of
  // amixer calls. No-ops cleanly if the slider isn't in the DOM (the tab
  // rendered its no-device empty state instead).
  function bindHwVolumeSlider(sliderId, valueId, eventName){
    var slider = document.getElementById(sliderId);
    if (!slider) return;
    var out = document.getElementById(valueId);
    on(slider, 'input', function(){ if (out) out.textContent = slider.value + '%'; });
    on(slider, 'change', function(){ emit(eventName, { volume: parseInt(slider.value, 10) }); });
  }

  // Remote Support / Privacy toggles (renderSupportSettings,
  // renderCrashReportSettings). A bare <input type=checkbox> is
  // interactive only through the platform's native click, and this repo's
  // target hardware drops those clicks on some widgets (see the
  // mousedown->click synthesis note above) -- the reported symptom was a
  // dead checkbox whose label text still toggled. So the ROW is the
  // control: a [tabindex] switch the synthesis path already covers, with
  // the inner checkbox display-only (pointer-events:none) just mirroring
  // state for the visual tick. One code path flips it, so no native/JS
  // double-toggle.
  function bindToggleRow(rowId, boxId, labelId, labelPrefix, eventName){
    var row = document.getElementById(rowId);
    if (!row) return;
    var box = document.getElementById(boxId);
    var label = document.getElementById(labelId);
    function flip(){
      var next = !box.checked;
      box.checked = next;
      row.setAttribute('aria-checked', next ? 'true' : 'false');
      if (label) label.textContent = labelPrefix + ' ' + (next ? 'on' : 'off');
      emit(eventName, { enabled: next });
    }
    on(row, 'click', flip);
    on(row, 'keydown', function(e){
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar'){ e.preventDefault(); flip(); }
    });
  }

  function bindScreenImpl(state, data){
    if (state === 'empty'){
      document.getElementById('btnAddBrain').onclick = guarded(showLocalAddBrain);
      var slimeIdBtn = document.getElementById('btnSlimeId');
      if (slimeIdBtn) slimeIdBtn.onclick = guarded(function(){ emit('slime:slime-id-start'); });
      var slimeIdLogoutBtn = document.getElementById('btnSlimeIdLogout');
      if (slimeIdLogoutBtn) slimeIdLogoutBtn.onclick = guarded(function(){ emit('slime:slime-id-logout'); });
    }
    else if (state === 'picker'){
      var list = document.getElementById('pickerList');
      on(list, 'keydown', function(e){
        if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
        var focusable = Array.prototype.slice.call(list.querySelectorAll('[tabindex]'));
        var idx = focusable.indexOf(document.activeElement);
        if (idx === -1) return;
        e.preventDefault();
        var next = e.key === 'ArrowDown' ? Math.min(idx + 1, focusable.length - 1) : Math.max(idx - 1, 0);
        focusable[next].focus();
      });
      list.querySelectorAll('.brain-card').forEach(function(card){
        var id = card.getAttribute('data-brain-id');
        on(card, 'click', function(){ emit('slime:connect', { id: id }); });
        on(card, 'keydown', function(e){ if (e.key === 'Enter') emit('slime:connect', { id: id }); });
      });
      list.querySelectorAll('.brain-remove').forEach(function(btn){
        on(btn, 'click', function(e){
          e.stopPropagation();
          pendingRemoveId = btn.getAttribute('data-remove-id');
          var brains = (current.data && current.data.brains) || [];
          var b = brains.filter(function(x){ return String(x.id) === String(pendingRemoveId); })[0];
          showRemoveConfirm(b);
        });
      });
      on(document.getElementById('btnAddBrainCard'), 'click', showLocalAddBrain);
      on(document.getElementById('btnAddBrainCard'), 'keydown', function(e){ if (e.key === 'Enter') showLocalAddBrain(); });
      var slimeIdBtn2 = document.getElementById('btnSlimeId2');
      if (slimeIdBtn2) slimeIdBtn2.onclick = guarded(function(){ emit('slime:slime-id-start'); });
      var slimeIdLogoutBtn2 = document.getElementById('btnSlimeIdLogout2');
      if (slimeIdLogoutBtn2) slimeIdLogoutBtn2.onclick = guarded(function(){ emit('slime:slime-id-logout'); });
    }
    else if (state === 'addBrain'){
      var form = document.getElementById('addBrainForm');
      var advBtn = document.getElementById('btnAdvanced');
      var advPanel = document.getElementById('advancedPanel');
      on(advBtn, 'click', function(){
        var open = !advPanel.classList.contains('hidden');
        advPanel.classList.toggle('hidden');
        advBtn.textContent = open ? '+ Advanced (port)' : '\u2212 Hide advanced';
      });
      on(document.getElementById('btnCancelAdd'), 'click', function(){ emit('slime:back'); });
      on(form, 'submit', function(e){
        e.preventDefault();
        var name = document.getElementById('fieldName').value.trim();
        var host = document.getElementById('fieldHost').value.trim();
        var hostInput = document.getElementById('fieldHost');
        var errBox = document.getElementById('hostError');
        if (!host || !HOST_RE.test(host)){
          hostInput.classList.add('error');
          errBox.textContent = 'Enter a valid IP address or hostname.';
          hostInput.focus();
          return;
        }
        hostInput.classList.remove('error');
        errBox.textContent = '';
        var port = document.getElementById('fieldPort').value.trim() || '3389';
        emit('slime:add-brain', { name: name || 'Untitled Brain', host: host, port: port });
      });
    }
    else if (state === 'credentials'){
      var cform = document.getElementById('credentialsForm');
      var toggleBtn = document.getElementById('btnTogglePw');
      var pwField = document.getElementById('fieldPassword');
      on(toggleBtn, 'click', function(){
        var showing = pwField.type === 'text';
        pwField.type = showing ? 'password' : 'text';
        toggleBtn.textContent = showing ? 'SHOW' : 'HIDE';
      });
      on(document.getElementById('btnBackFromCreds'), 'click', function(){ emit('slime:back'); });

    }
    else if (state === 'error'){
      on(document.getElementById('btnTryAgain'), 'click', function(){ emit('slime:retry'); });
      var reenterBtn = document.getElementById('btnReenterPassword');
      if (reenterBtn) on(reenterBtn, 'click', function(){ emit('slime:reenter-password'); });
      on(document.getElementById('btnBackFromError'), 'click', function(){ emit('slime:back'); });
    }
    else if (state === 'reconnecting'){

    }
    else if (state === 'wifiList'){
      var wlist = document.getElementById('wifiListRoot');
      on(wlist, 'keydown', function(e){
        if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
        var focusable = Array.prototype.slice.call(wlist.querySelectorAll('[tabindex]'));
        var idx = focusable.indexOf(document.activeElement);
        if (idx === -1) return;
        e.preventDefault();
        var next = e.key === 'ArrowDown' ? Math.min(idx + 1, focusable.length - 1) : Math.max(idx - 1, 0);
        focusable[next].focus();
      });
      wlist.querySelectorAll('.wifi-item').forEach(function(item){
        var ssid = item.getAttribute('data-ssid');
        on(item, 'click', function(){ emit('slime:wifi-connect', { ssid: ssid }); });
        on(item, 'keydown', function(e){ if (e.key === 'Enter') emit('slime:wifi-connect', { ssid: ssid }); });
      });
      var rescanBtn = document.getElementById('btnWifiRescan');
      if (rescanBtn) on(rescanBtn, 'click', function(){ emit('slime:wifi-rescan'); });
      var skipBtn = document.getElementById('btnWifiSkip');
      if (skipBtn) on(skipBtn, 'click', function(){ emit('slime:wifi-skip'); });
      var wbackBtn = document.getElementById('btnWifiBack');
      if (wbackBtn) on(wbackBtn, 'click', function(){ emit('slime:back'); });
    }
    else if (state === 'wifiPassword'){
      var wform = document.getElementById('wifiPasswordForm');
      var wToggle = document.getElementById('btnToggleWifiPw');
      var wPwField = document.getElementById('fieldWifiPassword');
      on(wToggle, 'click', function(){
        var showing = wPwField.type === 'text';
        wPwField.type = showing ? 'password' : 'text';
        wToggle.textContent = showing ? 'SHOW' : 'HIDE';
      });
      on(document.getElementById('btnBackFromWifiPw'), 'click', function(){ emit('slime:back'); });
      on(wform, 'submit', function(e){
        e.preventDefault();
        emit('slime:wifi-password', { password: wPwField.value });
      });
    }
    else if (state === 'wifiError'){
      on(document.getElementById('btnWifiTryAgain'), 'click', function(){ emit('slime:retry'); });
      var wReenter = document.getElementById('btnWifiReenterPassword');
      if (wReenter) on(wReenter, 'click', function(){ emit('slime:reenter-password'); });
      on(document.getElementById('btnBackFromWifiError'), 'click', function(){ emit('slime:back'); });
    }
    /* wifiConnecting has no interactive elements — nmcli connect is short and
       synchronous, unlike the long-lived xfreerdp session renderConnecting
       guards against, so no cancel affordance is needed. pairConnecting is
       the same shape, for the same reason. */
    else if (state === 'pairEntry'){
      var pform = document.getElementById('pairEntryForm');
      var pBackBtn = document.getElementById('btnBackFromPair');
      if (pBackBtn) on(pBackBtn, 'click', function(){ emit('slime:back'); });
      var pSkipBtn = document.getElementById('btnPairSkip');
      if (pSkipBtn) on(pSkipBtn, 'click', function(){ emit('slime:pair-skip'); });
      on(pform, 'submit', function(e){
        e.preventDefault();
        var hostInput = document.getElementById('fieldPairHost');
        var host = hostInput.value.trim();
        var errBox = document.getElementById('pairHostError');
        if (!host || !HOST_RE.test(host)){
          hostInput.classList.add('error');
          errBox.textContent = 'Enter a valid enrollment address.';
          hostInput.focus();
          return;
        }
        hostInput.classList.remove('error');
        var code = document.getElementById('fieldPairCode').value.trim();
        if (!code){
          errBox.textContent = 'Enter your pairing code.';
          return;
        }
        errBox.textContent = '';
        emit('slime:pair-submit', { host: host, code: code });
      });
    }
    else if (state === 'pairError'){
      on(document.getElementById('btnPairTryAgain'), 'click', function(){ emit('slime:retry'); });
      on(document.getElementById('btnBackFromPairError'), 'click', function(){ emit('slime:back'); });
    }
    else if (state === 'speakerSettings'){
      bindHwVolumeSlider('fieldSpeakerVolume', 'hwSpeakerVolumeValue', 'slime:speaker-volume-set');
      var btnSpk = document.getElementById('btnSpeakerTest');
      if (btnSpk) on(btnSpk, 'click', function(){ emit('slime:speaker-test', {}); });
    }
    else if (state === 'microphoneSettings'){
      bindHwVolumeSlider('fieldMicVolume', 'hwMicVolumeValue', 'slime:mic-volume-set');
      var btnMic = document.getElementById('btnMicTest');
      if (btnMic) on(btnMic, 'click', function(){ emit('slime:mic-test', {}); });
    }
    else if (state === 'cameraSettings'){
      var btnCam = document.getElementById('btnCameraPreview');
      if (btnCam) on(btnCam, 'click', function(){
        emit(data.previewing ? 'slime:camera-preview-stop' : 'slime:camera-preview-start', {});
      });
    }
    else if (state === 'supportSettings'){
      bindToggleRow('rowSupportToggle', 'fieldSupportToggle', 'lblSupportToggle', 'Remote Support is', 'slime:support-toggle');
    }
    else if (state === 'timezoneSettings'){
      var tzInput = document.getElementById('fieldTimezone');
      var tzDropdownRoot = document.getElementById('tzDropdownRoot');
      var tzZones = data.timezones || [];
      var tzMatches = [];
      var tzActiveIndex = -1;
      var tzOpen = false;

      function tzPosition(){
        var r = tzInput.getBoundingClientRect();
        var dd = tzDropdownRoot.firstChild;
        if (!dd) return;
        dd.style.left = r.left + 'px';
        dd.style.width = r.width + 'px';
        dd.style.top = (r.bottom + 4) + 'px';
      }
      function tzClose(){
        tzOpen = false;
        tzDropdownRoot.innerHTML = '';
      }
      function tzFilter(query){
        var q = query.trim().toLowerCase();
        var pool = q ? tzZones.filter(function(z){ return z.toLowerCase().indexOf(q) !== -1; }) : tzZones;
        return pool.slice(0, 60);
      }
      function tzRenderList(matches){
        tzMatches = matches;
        tzActiveIndex = matches.length ? 0 : -1;
        tzOpen = true;
        tzDropdownRoot.innerHTML = '<div class="tz-dropdown">' + (matches.length ? matches.map(function(z, i){
          return '<div class="tz-option' + (i === 0 ? ' active' : '') + '" data-zone="' + escapeHtml(z) + '">' + escapeHtml(z) + '</div>';
        }).join('') : '<div class="tz-empty">No matching timezone</div>') + '</div>';
        // Bound HERE, fresh on the just-created .tz-dropdown node, not
        // once on the persistent #tzDropdownRoot in the outer scope below
        // -- #tzDropdownRoot itself is never replaced (that's what lets it
        // escape the settings panel's clipping), so a listener bound to IT
        // inside bindScreen (which reruns on every emit_state, including
        // once per successful timezone change) would stack a new one on
        // top of every prior one forever. Confirmed live 2026-08-14: by
        // the second change, N stacked listeners all fired off one real
        // click, spamming timezoneSet that many times. Binding to the
        // freshly-created child instead means the old node (and its
        // listener) is simply garbage-collected when innerHTML replaces it
        // -- exactly the same reasoning screenRoot's own re-render relies
        // on, just one level deeper since this element sits outside it.
        on(tzDropdownRoot.firstChild, 'mousedown', function(e){
          var opt = e.target.closest('.tz-option');
          if (!opt) return;
          e.preventDefault();
          tzChoose(opt.getAttribute('data-zone'));
        });
        tzPosition();
      }
      function tzHighlight(index){
        tzActiveIndex = index;
        Array.prototype.forEach.call(tzDropdownRoot.querySelectorAll('.tz-option'), function(el, i){
          el.classList.toggle('active', i === index);
        });
      }
      function tzChoose(zone){
        tzInput.value = zone;
        tzClose();
        emit('slime:timezone-set', { timezone: zone });
      }

      // Deliberately NOT bound to 'focus': this screen's autofocus() (see
      // its own function, called ~30ms after every render) programmatically
      // focuses this input on every tab-open, which would otherwise pop the
      // full list open unasked-for on every visit to this tab (confirmed
      // live 2026-08-14). mousedown reflects a real user action; typing
      // ('input') opens/narrows it too.
      on(tzInput, 'mousedown', function(){ if (!tzOpen) tzRenderList(tzFilter(tzInput.value)); });
      on(tzInput, 'input', function(){ tzRenderList(tzFilter(tzInput.value)); });
      on(tzInput, 'keydown', function(e){
        if (!tzOpen){
          if (e.key === 'ArrowDown' || e.key === 'ArrowUp') tzRenderList(tzFilter(tzInput.value));
          return;
        }
        if (e.key === 'ArrowDown'){ e.preventDefault(); tzHighlight(Math.min(tzActiveIndex + 1, tzMatches.length - 1)); }
        else if (e.key === 'ArrowUp'){ e.preventDefault(); tzHighlight(Math.max(tzActiveIndex - 1, 0)); }
        else if (e.key === 'Enter'){ e.preventDefault(); if (tzMatches[tzActiveIndex]) tzChoose(tzMatches[tzActiveIndex]); }
        else if (e.key === 'Escape'){ e.stopPropagation(); tzClose(); tzInput.value = data.current || 'UTC'; }
      });
      // (Selecting an option is handled inside tzRenderList() above, bound
      // fresh to each dropdown instance -- see its comment for why it
      // can't live here on the outer, persistent #tzDropdownRoot. mousedown
      // rather than click: fires before the input's own blur, and sidesteps
      // this hardware's click-registration quirk documented above `on()`'s
      // global mousedown-synthesizes-click workaround -- these option rows
      // aren't `button`/`[tabindex]` so that workaround doesn't cover them
      // anyway, making mousedown the more reliable event here regardless.)
      on(tzInput, 'blur', function(){
        setTimeout(function(){
          tzClose();
          if (tzInput.value !== data.current) tzInput.value = data.current || 'UTC';
        }, 150);
      });
    }
    else if (state === 'crashReportSettings'){
      bindToggleRow('rowCrashReportToggle', 'fieldCrashReportToggle', 'lblCrashReportToggle', 'Anonymous error reporting is', 'slime:crash-report-toggle');
    }
    /* slimeIdConnecting has no interactive elements -- same reasoning as
       wifiConnecting/pairConnecting above. */
    else if (state === 'slimeIdEntry'){
      on(document.getElementById('btnSlimeIdBack'), 'click', function(){ emit('slime:back'); });
    }
    else if (state === 'slimeIdError'){
      on(document.getElementById('btnSlimeIdTryAgain'), 'click', function(){ emit('slime:retry'); });
      on(document.getElementById('btnBackFromSlimeIdError'), 'click', function(){ emit('slime:back'); });
    }
  }

  function autofocus(state){
    setTimeout(function(){
      var el = screenRoot.querySelector('[data-autofocus]');
      if (el && el.getAttribute('data-autofocus') !== '0') el.focus();
    }, 30);
  }
