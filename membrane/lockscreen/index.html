<!--
=================================================================================
 SLIME OS LOCK SCREEN — KIOSK BUNDLE
 Self-contained static HTML/CSS/JS. No network requests, no build step, no
 external runtime. Open directly in a WPE WebKit / Chromium kiosk browser.

 ---------------------------------------------------------------------------
 INTEGRATION CONTRACT
 ---------------------------------------------------------------------------

 The backend drives the UI by calling:

   window.SlimeUI.setState(state, data)
     state: 'empty' | 'picker' | 'addBrain' | 'credentials' |
            'connecting' | 'error' | 'reconnecting' | 'disconnected' |
            'wifiList' | 'wifiPassword' | 'wifiConnecting' | 'wifiError' |
            'pairEntry' | 'pairConnecting' | 'pairError' | 'supportSettings' |
            'crashReportSettings' | 'slimeIdConnecting' | 'slimeIdEntry' | 'slimeIdError'
     data per state:
       empty:        { signedInEmail: string | null }
       picker:       { brains: [{ id, name, host, lastConnected, remote?: bool }], signedInEmail: string | null }
                       // signedInEmail is set once do_slime_id_login() has ever
                       // completed successfully on this device (see
                       // membrane/session/slime-id.sh) -- a purely local-state
                       // read, not live-revalidated against the backend (this
                       // pass stops at "prove the handshake works," see
                       // slimeIdEntry below). null shows the "Sign in with
                       // Slime ID" button; set shows a "Signed in as
                       // {email}" line (masked client-side via
                       // maskEmail() -- this is on-screen indefinitely on
                       // a kiosk, never send the full address to the
                       // display layer expecting it to stay private) plus
                       // a Sign out button.
                       // remote:true marks a brain bookmarked to this Slime
                       // ID account but not yet paired on THIS device (see
                       // coordinator.sh's REMOTE_BRAINS_JSON) -- rendered as
                       // a distinct "tap to reconnect" card with no remove
                       // (×) button (removing a bookmark is dashboard-only).
                       // Clicking it still fires the same 'slime:connect'
                       // event; the backend recognizes the id and routes to
                       // pairEntry instead of connecting directly, since
                       // Slime ID never holds the WireGuard credential for a
                       // free Brain. Omitted/false for an ordinary local card.
       credentials:  { brainName, needUsername: bool }   // false => password-only
       connecting:   { brainName, stage }                // stage: free-text microcopy
       error:        { brainName, message, detail }      // detail = raw code (collapsed)
       reconnecting: { brainName, attempt }
       disconnected: {}   // client-only — driven by the WS bridge glue at the
                          // bottom of this file, never sent by the backend.
                          // Shown before the first WS connection succeeds and
                          // whenever it drops; no buttons (nothing could
                          // route an event anywhere while disconnected).
       wifiList:       { networks: [{ssid, signal, secured}], scanning: bool,
                         mode: 'boot'|'settings', connectionType: ''|'ethernet'|'wifi',
                         connectionSsid: string, skippable: bool }
                       // connectionType/connectionSsid describe what's ACTUALLY
                       // providing connectivity right now (queried live via
                       // nmcli device type, not just "is there some route") --
                       // connectionSsid is only meaningful when connectionType
                       // is 'wifi'.
                       // mode 'boot' = shown automatically, no working network
                       // yet (Skip button, no Back), full-screen. mode
                       // 'settings' = opened deliberately from the gear icon's
                       // Settings panel while a network already works (Back
                       // button, no Skip; rendered inside the panel's
                       // Internet tab, with the tab bar shown alongside it).
       wifiPassword:   { ssid, mode }
       wifiConnecting: { ssid, stage }
       wifiError:      { ssid, message, detail, mode, secured: bool }
                       // secured governs whether "Re-enter password" shows —
                       // meaningless for an open network. wifiPassword/
                       // wifiConnecting/wifiError render inside the Settings
                       // panel in `settings` mode same as wifiList, but
                       // without the tab bar (Back already returns to
                       // wifiList, same as it does in `boot` mode).
       pairEntry:      { mode: 'boot'|'settings', skippable: bool, hint?: string | null }
                       // WireGuard self-pairing (see brain/enroll/): host +
                       // code entry. mode/skippable follow the same
                       // boot-vs-settings convention as wifiList -- `settings`
                       // renders inside the panel's Pairing tab. `hint`, when
                       // set, is shown as a subtitle above the form -- only
                       // set when entered by tapping a remote/bookmark picker
                       // card (see pair.sh's PAIR_HINT), null/absent for every
                       // other entry point (boot pairing, Settings > Pair).
       pairConnecting: { stage }
       pairError:      { message, detail, mode }
                       // No secured/re-enter-password concept here (one
                       // secret field, not two) — just Try again / Back.
       supportSettings: { mode: 'settings', enabled: bool,
                          connection: {host, port, username, password} | null,
                          error: string | null, version: string }
                       // Settings panel's Support tab -- lets a user opt a
                       // device in to SSH access for the Slime OS support
                       // team, reachable only over the WireGuard subnet (see
                       // membrane/session/remote-support-toggle.sh). No
                       // `boot` mode -- this screen only ever exists inside
                       // the Settings panel. `connection` is the one
                       // deliberate exception to "never echo a secret to the
                       // browser except slime:credentials" — here the
                       // backend GENERATES the secret and the whole point is
                       // showing it on screen so the user can read it off to
                       // support; it's re-randomized every time `enabled`
                       // flips true, so an old screenshot of it is useless.
                       // `version` is the installed Membrane version, written
                       // once by install.sh and read verbatim -- purely
                       // informational, display-only, no update affordance.
       crashReportSettings: { mode: 'settings', enabled: bool }
                       // Settings panel's Privacy tab -- one toggle for
                       // anonymous error reporting (see
                       // membrane/session/crash-reporting.sh). No `boot`
                       // mode, same as supportSettings; the FIRST-EVER
                       // decision is instead made via the one-shot
                       // 'showCrashConsent' message below, before the user
                       // has ever opened Settings at all.
       slimeIdConnecting: { stage }
                       // "Sign in with Slime ID" (see
                       // membrane/session/slime-id.sh) -- reached directly
                       // from the empty/picker screen's button, not the
                       // Settings panel, and has no `mode` at all (no
                       // boot/settings distinction, unlike every other
                       // multi-mode screen above). Brief transitional
                       // screen while POSTing /api/device/start.
       slimeIdEntry:   { userCode, verificationUri, qrDataUrl }
                       // qrDataUrl is a data:image/gif;base64,... URL, used
                       // as a plain <img src>. Started as raw inline SVG
                       // markup instead -- confirmed live on a real WPE
                       // WebKit kiosk 2026-08-09 that foreign-content SVG
                       // via innerHTML rendered wrong (empty box, then a
                       // squashed shape instead of a square) even with an
                       // explicit pixel size baked into the tag. A real
                       // raster image sidesteps that whole class of
                       // embedded-engine quirk. Shown while the backend
                       // polls in the background; Back cancels.
       slimeIdError:   { message, detail }
                       // Same visual convention as pairError -- Try again
                       // (fetches a fresh code) / Back.

     Examples:
       SlimeUI.setState('picker', { brains: [
         { id: 'b1', name: 'Home Office', host: '192.168.1.42', lastConnected: '2 hours ago' }
       ]});
       SlimeUI.setState('credentials', { brainName: 'Home Office', needUsername: true });
       SlimeUI.setState('connecting', { brainName: 'Home Office', stage: 'Waking up your Brain…' });
       SlimeUI.setState('error', { brainName: 'Home Office', message: "That password didn't work.", detail: 'ERR_AUTH_1002' });
       SlimeUI.setState('reconnecting', { brainName: 'Home Office', attempt: 2 });
       SlimeUI.setState('wifiList', { networks: [{ssid:'HomeNet', signal:80, secured:true}], scanning:false, mode:'boot', connectionType:'', connectionSsid:'', skippable:true });

   window.SlimeUI.setStatus({ clock, tunnel })
     clock:  'HH:MM' string. Once set, the strip advances it locally every 30s.
     tunnel: 'up' | 'down' | 'connecting'

     Example:
       SlimeUI.setStatus({ clock: '14:32', tunnel: 'up' });

   {"type":"showCrashConsent"} (raw WS message, not a SlimeUI call)
     One-shot instruction to render the anonymous-error-reporting consent
     modal on top of whatever screen is currently showing -- sent by the
     coordinator at most once ever, the first time a device reaches the
     idle screen with no prior answer on file. Pure client-side overlay,
     same shape as the Power-options/remove-brain confirm modals: it never
     touches `current.state`, so closing it just reveals whatever was
     already rendered underneath.

   {"type":"showSaveBrainPrompt","data":{name,host,port}} (raw WS message, not a SlimeUI call)
     Same one-shot-overlay shape as showCrashConsent, sent right after a
     brain is successfully added locally (see the addBrain case in
     coordinator.sh) while the device is signed in to Slime ID. Asks
     whether to also save the brain to the account so it appears as a
     bookmark on other signed-in devices -- opt-in, never automatic.
     Answered via 'slime:save-brain-consent'.

 The page never calls a backend directly — it only fires DOM CustomEvents on
 `document`, payload in `event.detail`. The backend listens and responds with
 setState/setStatus calls:

   'slime:add-brain'       { name, host, port }         // port defaults to 3389
     document.addEventListener('slime:add-brain', e => { e.detail /* {name,host,port} */ });

   'slime:connect'         { id }
   'slime:remove-brain'    { id }                        // fired AFTER user confirms
   'slime:credentials'     { username?, password }       // username omitted if not needed
   'slime:retry'           {}
   'slime:reenter-password' {}
   'slime:back'            {}                            // back to picker, or cancel
   'slime:cancel-connect'  {}

   'slime:open-settings'   {}                             // gear icon: open the tabbed Settings panel (defaults to its Internet tab)
   'slime:settings-tab'    { tab }                        // Settings panel's tab bar -- tab: 'internet'|'pair'|'support'|'privacy'
   'slime:wifi-connect'    { ssid }
   'slime:wifi-password'   { password }
   'slime:wifi-rescan'     {}
   'slime:wifi-skip'       {}                             // boot mode only

   'slime:power-shutdown'  {}                             // power icon, confirmed -- no response expected, the machine powers off
   'slime:power-restart'   {}                             // power icon, confirmed -- no response expected, the machine reboots

   'slime:pair-submit'     { host, code }
   'slime:pair-skip'       {}                             // boot mode only

   'slime:support-toggle'  { enabled }                    // Settings panel's Support tab checkbox

   'slime:crash-report'    { message, stack, state }       // auto-fired by window.onerror/unhandledrejection,
     never by a user action -- the page always fires this regardless of the
     user's reporting choice; the coordinator is the sole place that checks
     consent before doing anything with it (see crash-reporting.sh). `state`
     is whatever `current.state` was when the error happened, for context.
   'slime:crash-consent'   { granted }                     // answer to the one-shot consent modal (OK/Cancel)
   'slime:crash-report-toggle' { enabled }                 // Settings panel's Privacy tab checkbox

   'slime:slime-id-start'  {}                              // "Sign in with Slime ID" button on empty/picker.
     slimeIdEntry reuses 'slime:back' (cancels while waiting) and slimeIdError
     reuses 'slime:retry' (fresh code) / 'slime:back' -- same as pairError,
     no new names needed for those two.
   'slime:slime-id-logout' {}                              // "Sign out" button, shown instead of the sign-in
     button once signedInEmail is set.
   'slime:save-brain-consent' { save, name, host, port }   // answer to the one-shot showSaveBrainPrompt
     overlay (Save / Not now) -- echoes back the same name/host/port it was shown, so the backend
     doesn't need to remember any state between the prompt and the answer.

   Network setup reuses 'slime:retry' / 'slime:reenter-password' / 'slime:back'
   for the wifiError screen and 'slime:back' for backing out of wifiList in
   settings mode — same semantics (retry same target / re-supply secret / go
   back) as the Brain-connect flow, so no separate wifi-specific names exist
   for those three. Pairing reuses 'slime:retry' / 'slime:back' the same way
   (no re-enter-password equivalent — pairError has only one secret field).
   'slime:back' from a Settings panel top-level tab (wifiList/pairEntry/
   supportSettings, all in `settings` mode) closes the whole panel, same as
   clicking its × — 'slime:settings-tab' instead switches to a different tab
   without closing it. Pairing/network-setup/support boot-mode screens never
   emit 'slime:settings-tab' — there's no tab bar outside the panel.

 All form state (typed name/host/password, toggles) lives only in this page.
 The password is never stored or echoed anywhere except the single
 'slime:credentials' event payload at submit time.

 ---------------------------------------------------------------------------
 DEMO MODE
 ---------------------------------------------------------------------------
 Load with ?demo=1 to run a self-contained driver (bottom of this file) that
 seeds two Brains, logs every slime:* event to the console, and simulates a
 connect → connecting → error → retry → connecting → reconnecting flow so
 every screen is reachable by clicking through. Without ?demo=1 the page
 boots to 'disconnected' and opens a WebSocket to slimeos-bridge on
 ws://127.0.0.1:7770 (see the bridge glue script at the bottom of this file);
 the real backend takes over from there via SlimeUI calls.
=================================================================================
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slime OS</title>
<style>
  @font-face {
    font-family: 'Space Grotesk';
    src: url('./fonts/space-grotesk.woff2') format('woff2');
    font-weight: 400 700;
    font-display: swap;
  }
  @font-face {
    font-family: 'Plus Jakarta Sans';
    src: url('./fonts/plus-jakarta-sans.woff2') format('woff2');
    font-weight: 400 800;
    font-display: swap;
  }
  @font-face {
    font-family: 'JetBrains Mono';
    src: url('./fonts/jetbrains-mono.woff2') format('woff2');
    font-weight: 400 600;
    font-display: swap;
  }

  :root{
    --shell:#05080b;
    --surface:#13191f;
    --elevated:#1C2530;
    --teal:#00C2A8;
    --teal-deep:#008B99;
    --mint:#5FE6D2;
    --text:#EAF1F7;
    --text-muted:#8B97A7;
    --text-dim:#56616f;
    --text-faint:#3f4954;
    --error:#ff8f8f;
    --font-display:'Space Grotesk', system-ui, sans-serif;
    --font-body:'Plus Jakarta Sans', system-ui, sans-serif;
    --font-mono:'JetBrains Mono', ui-monospace, monospace;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:var(--shell);}
  body{
    font-family:var(--font-body);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  button, input{font-family:inherit;}
  input::placeholder{color:var(--text-dim);}
  ::selection{background:rgba(0,194,168,0.35);}

  @keyframes fadeUp{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
  @keyframes ambientDrift{0%,100%{background-position:0% 20%, 100% 80%}50%{background-position:8% 26%, 92% 74%}}
  @keyframes pulseRing{0%{transform:scale(0.85);opacity:0.55}70%{transform:scale(1.35);opacity:0}100%{opacity:0}}
  @keyframes blobFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes spin{to{transform:rotate(360deg)}}

  .app{
    position:relative;width:100%;height:100vh;
    background:
      radial-gradient(120% 90% at 15% 10%, rgba(0,194,168,0.10), transparent 55%),
      radial-gradient(110% 90% at 90% 90%, rgba(79,172,254,0.08), transparent 55%),
      var(--shell);
    background-size:180% 180%,180% 180%;
    animation:ambientDrift 26s ease-in-out infinite;
  }

  /* -------- status strip -------- */
  .status-strip{
    position:absolute;top:0;left:0;right:0;height:44px;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 22px;font-family:var(--font-mono);font-size:11.5px;letter-spacing:0.5px;
    color:var(--text-muted);z-index:40;
  }
  .status-strip .brand{display:flex;align-items:center;gap:8px;color:var(--text-muted);}
  .status-strip .brand svg{width:16px;height:14px;opacity:0.85;}
  .status-strip .right{display:flex;align-items:center;gap:18px;}
  .tunnel-dot{width:6px;height:6px;border-radius:50%;display:inline-block;}
  .tunnel{display:flex;align-items:center;gap:6px;}
  .bars{display:flex;align-items:flex-end;gap:2px;height:11px;}
  .bars span{width:3px;background:var(--text-muted);border-radius:1px;}
  .settings-gear{display:flex;align-items:center;cursor:pointer;color:var(--text-muted);outline:none;}
  .settings-gear:hover{color:#C9D3DF;}
  .settings-gear:focus-visible{outline:2px solid var(--mint);outline-offset:3px;border-radius:4px;}

  /* -------- shared layout -------- */
  .screen{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;animation:fadeUp .4s ease both;}
  .card{width:100%;max-width:400px;background:var(--surface);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:36px;}
  h1.title{margin:0;font-family:var(--font-display);font-weight:700;font-size:34px;letter-spacing:-0.6px;color:#F2F6FB;text-align:center;}
  h2.title{margin:0 0 6px;font-family:var(--font-display);font-weight:700;font-size:21px;color:#F2F6FB;}
  p.subtitle{margin:16px 0 0;max-width:420px;font-size:15.5px;line-height:1.65;color:var(--text-muted);text-align:center;}

  label.field-label{display:block;font-family:var(--font-mono);font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mint);margin-bottom:8px;}
  input.field{width:100%;background:#0d1217;border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:12px 14px;font-size:14.5px;color:var(--text);outline:none;margin-bottom:18px;}
  input.field:focus-visible{border-color:var(--teal);outline:2px solid rgba(0,194,168,0.35);outline-offset:1px;}
  input.field.error{border-color:var(--error);}

  button{cursor:pointer;}
  button:focus-visible, [tabindex]:focus-visible, a:focus-visible{outline:2px solid var(--mint);outline-offset:3px;}

  .btn-primary{
    font-family:var(--font-display);font-weight:600;font-size:15px;color:#04221f;
    background:linear-gradient(150deg,#00F2FE,#00C2A8);border:none;border-radius:12px;
    padding:15px 30px;box-shadow:0 14px 30px -14px rgba(0,242,254,0.55);
  }
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-secondary{
    background:none;border:1px solid rgba(255,255,255,0.14);border-radius:10px;
    padding:12px;font-family:var(--font-display);font-weight:600;font-size:14px;color:#C9D3DF;
  }
  .btn-secondary:hover{border-color:rgba(255,255,255,0.3);}
  .btn-ghost{
    font-family:var(--font-mono);font-size:11px;letter-spacing:1.5px;color:var(--text-dim);
    background:none;border:none;text-transform:uppercase;padding:8px;
  }
  .btn-ghost:hover{color:#7d8a9a;}

  /* -------- picker -------- */
  .picker-list{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;max-width:760px;width:100%;}
  .brain-card{
    position:relative;width:280px;background:var(--surface);border:1px solid rgba(255,255,255,0.08);
    border-radius:16px;padding:20px;cursor:pointer;outline:none;transition:border-color .15s, transform .15s;
  }
  .brain-card:hover{border-color:rgba(0,194,168,0.4);transform:translateY(-2px);}
  .brain-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .brain-id{display:flex;align-items:center;gap:12px;min-width:0;}
  .brain-avatar{width:36px;height:36px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:15px;color:#04221f;}
  .brain-name{font-family:var(--font-display);font-weight:600;font-size:15.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .brain-host{font-family:var(--font-mono);font-size:11px;color:#7d8a9a;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .brain-remove{background:none;border:none;color:var(--text-dim);font-size:16px;line-height:1;padding:4px 6px;border-radius:6px;}
  .brain-remove:hover{color:var(--error);background:rgba(255,107,107,0.08);}
  .brain-meta{margin-top:16px;display:flex;align-items:center;justify-content:space-between;}
  .brain-meta .last{font-size:11.5px;color:var(--text-faint);}
  .brain-meta .connect{font-family:var(--font-display);font-weight:600;font-size:12.5px;color:var(--mint);}
  /* A Slime ID bookmark not yet paired on this device -- dashed border
     distinguishes it from an ordinary, already-connectable card. */
  .brain-card-bookmark{border-style:dashed;border-color:rgba(0,194,168,0.3);}
  .brain-bookmark-badge{display:inline-block;font-family:var(--font-sans, inherit);font-weight:600;font-size:9.5px;letter-spacing:.3px;text-transform:uppercase;color:var(--mint);background:rgba(0,194,168,0.12);border-radius:5px;padding:2px 6px;margin-left:4px;vertical-align:middle;}
  .add-card{width:280px;background:transparent;border:1px dashed rgba(255,255,255,0.16);border-radius:16px;padding:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;min-height:96px;outline:none;color:var(--text-muted);}
  .add-card:hover{border-color:rgba(0,194,168,0.5);color:var(--mint);}

  /* -------- connecting -------- */
  .ring-wrap{position:relative;width:120px;height:120px;display:flex;align-items:center;justify-content:center;}
  .ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(0,194,168,0.5);animation:pulseRing 2.2s ease-out infinite;}
  .ring.inner{inset:14px;animation-delay:.6s;}

  /* -------- error -------- */
  .error-card{width:100%;max-width:420px;background:var(--surface);border:1px solid rgba(255,111,111,0.18);border-radius:20px;padding:36px;text-align:center;}
  .error-icon{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;background:rgba(255,107,107,0.12);color:var(--error);font-size:24px;font-family:var(--font-display);font-weight:700;}
  .error-actions{display:flex;flex-direction:column;gap:10px;margin-top:28px;}
  .btn-tertiary{background:none;border:none;padding:10px;font-family:var(--font-display);font-weight:600;font-size:13.5px;color:var(--text-muted);}
  .btn-tertiary:hover{color:#C9D3DF;}
  details.tech{margin-top:24px;border-top:1px dashed rgba(255,255,255,0.08);padding-top:14px;text-align:left;}
  details.tech summary{cursor:pointer;color:var(--text-dim);font-family:var(--font-mono);font-size:10.5px;letter-spacing:1px;list-style:none;}
  details.tech summary::-webkit-details-marker{display:none;}
  details.tech summary:hover{color:#7d8a9a;}
  details.tech .code{margin-top:8px;font-family:var(--font-mono);font-size:11px;color:var(--text-dim);background:#0d1217;border-radius:8px;padding:10px 12px;}

  /* -------- reconnecting overlay -------- */
  .reconnect-panel{background:rgba(13,17,23,0.92);border:1px solid rgba(255,255,255,0.1);border-radius:18px;padding:34px 40px;text-align:center;max-width:360px;}
  .spinner{display:inline-block;width:26px;height:26px;border:2px solid rgba(0,194,168,0.3);border-top-color:var(--teal);border-radius:50%;animation:spin .9s linear infinite;}

  /* -------- modal -------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(4,6,8,0.6);display:flex;align-items:center;justify-content:center;z-index:80;}
  .modal-card{width:100%;max-width:360px;background:var(--surface);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:28px;}

  /* -------- settings panel (gear icon) -------- */
  .settings-panel{
    width:100%;max-width:640px;max-height:min(680px,86vh);
    background:var(--surface);border:1px solid rgba(255,255,255,0.1);border-radius:20px;
    display:flex;flex-direction:column;overflow:hidden;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.55);
  }
  .settings-panel-header{display:flex;align-items:center;justify-content:space-between;padding:22px 26px 0;flex-shrink:0;}
  .settings-title{margin:0;font-family:var(--font-display);font-weight:700;font-size:19px;color:#F2F6FB;}
  .settings-close{background:none;border:none;color:var(--text-muted);font-size:20px;line-height:1;padding:6px 10px;border-radius:8px;}
  .settings-close:hover{color:#fff;background:rgba(255,255,255,0.08);}
  .settings-tabs{display:flex;gap:4px;padding:16px 26px 0;border-bottom:1px solid rgba(255,255,255,0.08);flex-shrink:0;}
  .settings-tab{background:none;border:none;color:var(--text-muted);font-family:var(--font-display);font-weight:600;font-size:13.5px;padding:10px 16px;border-radius:10px 10px 0 0;position:relative;top:1px;border-bottom:2px solid transparent;}
  .settings-tab:hover{color:#C9D3DF;}
  .settings-tab.active{color:var(--mint);border-bottom-color:var(--mint);}
  .settings-body{flex:1;overflow-y:auto;padding:6px 8px 8px;}
  /* wifiList/pairEntry/supportSettings render their normal full-page
     `.screen` markup unchanged (see render()'s isSettingsPanel wrapping) --
     this reclaims that layout to fit inside the panel body instead of
     assuming the full viewport. */
  .settings-body .screen{min-height:0;height:auto;padding:18px 18px 26px;justify-content:flex-start;animation:none;}

  .support-toggle-row{display:flex;align-items:center;gap:12px;cursor:pointer;padding:14px 16px;background:#0d1217;border:1px solid rgba(255,255,255,0.12);border-radius:12px;}
  .support-toggle-row input{width:18px;height:18px;accent-color:var(--teal);}
  .support-connection{margin-top:20px;background:#0d1217;border:1px solid rgba(0,194,168,0.25);border-radius:12px;padding:18px;}
  .support-connection dl{margin:0;font-family:var(--font-mono);font-size:13px;color:var(--text);display:grid;grid-template-columns:auto 1fr;gap:6px 14px;}
  .support-connection dt{color:var(--text-dim);}
  .support-connection dd{margin:0;color:var(--mint);word-break:break-all;}

  .hidden{display:none !important;}

  @media (max-width:1400px){
    h1.title{font-size:30px;}
  }
</style>
</head>
<body>
<div class="app" id="app">

  <div class="status-strip" id="statusStrip">
    <div class="brand">
      <svg viewBox="0 0 120 104" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" fill="#ffffff" d="M60,8 C84.3,8 104,27.7 104,52 C104,76.3 84.3,96 60,96 C35.7,96 16,76.3 16,52 C16,27.7 35.7,8 60,8 Z M60,30 C72.15,30 82,39.85 82,52 C82,64.15 72.15,74 60,74 C47.85,74 38,64.15 38,52 C38,39.85 47.85,30 60,30 Z"></path></svg>
      <span>Slime OS</span>
    </div>
    <div class="right">
      <span class="tunnel" id="tunnelIndicator"><span class="tunnel-dot" id="tunnelDot"></span><span id="tunnelLabel">Not connected</span></span>
      <span class="settings-gear" id="btnOpenSettings" tabindex="0" role="button" title="Settings"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 13a7.97 7.97 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a8.1 8.1 0 0 0-1.7-1L14.9 3h-4l-.4 2.9a8.1 8.1 0 0 0-1.7 1l-2.5-1-2 3.5L6.4 11a7.97 7.97 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.8 1.7 1l.4 2.9h4l.4-2.9c.6-.2 1.2-.6 1.7-1l2.5 1 2-3.5-2.1-1.6Z"></path></svg></span>
      <span class="settings-gear" id="btnPower" tabindex="0" role="button" title="Power options"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2v8"></path><path d="M18.4 6.6a9 9 0 1 1-12.8 0"></path></svg></span>
      <span class="bars"><span style="height:4px;"></span><span style="height:7px;"></span><span style="height:11px;"></span></span>
      <span id="clockLabel">--:--</span>
    </div>
  </div>

  <div id="screenRoot"></div>

  <div id="modalRoot"></div>

</div>

<script>
(function(){
  'use strict';

  /* ===================== SVG assets (inlined, no network) ===================== */

  function slimeBlobSVG(size, colorMode, showDrip){
    var gradId = 'slimeBody_' + Math.random().toString(36).slice(2);
    var glossId = 'slimeGloss_' + Math.random().toString(36).slice(2);
    var fill = colorMode === 'white' ? '#FFFFFF' : colorMode === 'black' ? '#0D1117' : ('url(#' + gradId + ')');
    var drip = showDrip ? '<path d="M60,90 C57,97 53,103 53,107 A7,7 0 1,0 67,107 C67,103 63,97 60,90 Z" fill="' + fill + '"></path>' : '';
    var gloss = colorMode === 'color' ? (
      '<ellipse cx="45" cy="33" rx="13" ry="7.5" transform="rotate(-38 45 33)" fill="url(#' + glossId + ')"></ellipse>' +
      '<circle cx="87" cy="38" r="2.8" fill="#ffffff" fill-opacity="0.5"></circle>'
    ) : '';
    var viewBox = showDrip ? '0 0 120 122' : '0 0 120 104';
    return (
      '<svg viewBox="' + viewBox + '" width="' + size + '" height="' + (size * (showDrip ? 122/120 : 104/120)) + '" style="display:block">' +
        '<defs>' +
          '<linearGradient id="' + gradId + '" x1="0" y1="0" x2="0.25" y2="1">' +
            '<stop offset="0" stop-color="#00F2FE"></stop>' +
            '<stop offset="0.16" stop-color="#1FD6C6"></stop>' +
            '<stop offset="0.5" stop-color="#00C2A8"></stop>' +
            '<stop offset="1" stop-color="#008B99"></stop>' +
          '</linearGradient>' +
          '<radialGradient id="' + glossId + '" cx="0.34" cy="0.26" r="0.55">' +
            '<stop offset="0" stop-color="#ffffff" stop-opacity="0.9"></stop>' +
            '<stop offset="0.6" stop-color="#ffffff" stop-opacity="0.12"></stop>' +
            '<stop offset="1" stop-color="#ffffff" stop-opacity="0"></stop>' +
          '</radialGradient>' +
        '</defs>' +
        drip +
        '<path fill-rule="evenodd" fill="' + fill + '" d="M60,8 C84.3,8 104,27.7 104,52 C104,76.3 84.3,96 60,96 C35.7,96 16,76.3 16,52 C16,27.7 35.7,8 60,8 Z M60,30 C72.15,30 82,39.85 82,52 C82,64.15 72.15,74 60,74 C47.85,74 38,64.15 38,52 C38,39.85 47.85,30 60,30 Z"></path>' +
        gloss +
      '</svg>'
    );
  }

  var ACCENTS = ['#00C2A8', '#4FACFE', '#00FF87'];
  var STAGE_FALLBACK = 'Waking up your Brain\u2026';
  var HOST_RE = /^(?:(?:\d{1,3}\.){3}\d{1,3}|[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*)$/;

  /* ===================== state ===================== */

  var current = { state: 'empty', data: {} };
  var pendingRemoveId = null;
  var clockDate = null;
  var clockTimer = null;

  var screenRoot = document.getElementById('screenRoot');
  var modalRoot = document.getElementById('modalRoot');

  function emit(name, detail){
    document.dispatchEvent(new CustomEvent(name, { detail: detail || {} }));
  }

  function escapeHtml(str){
    return String(str == null ? '' : str).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  // The "Signed in as ..." line on empty/picker is on-screen indefinitely
  // on a kiosk anyone walking by can see -- mask most of the local part
  // (where a real name usually lives) but keep the domain visible, e.g.
  // "tommy@gmail.com" -> "t***y@gmail.com".
  function maskEmail(email){
    var parts = String(email || '').split('@');
    if (parts.length !== 2 || !parts[0]) return String(email || '');
    var local = parts[0], domain = parts[1];
    var masked = local.length <= 2 ? (local.charAt(0) + '*') : (local.charAt(0) + '***' + local.charAt(local.length - 1));
    return masked + '@' + domain;
  }

  /* ===================== crash reporting =====================
     Always fires on any uncaught error/rejection, regardless of the user's
     reporting choice -- this page never checks consent itself (see
     'slime:crash-report' in the header comment). The coordinator is the
     one place that decides whether to actually send anything anywhere.
  */
  window.addEventListener('error', function(e){
    emit('slime:crash-report', {
      message: e.message || 'Unknown error',
      stack: (e.error && e.error.stack) || '',
      state: current.state
    });
  });
  window.addEventListener('unhandledrejection', function(e){
    var reason = e.reason;
    emit('slime:crash-report', {
      message: (reason && reason.message) || String(reason || 'Unhandled rejection'),
      stack: (reason && reason.stack) || '',
      state: current.state
    });
  });

  // Real-hardware finding (2026-08-08, UTM VM): the global 'error' handler
  // above is a necessary last-resort fallback, but under this page's
  // file:// origin, WPE WebKit redacts window.onerror's own message/stack
  // to the generic "Script error." for interactive-handler exceptions --
  // confirmed live (a real bug during Settings/Privacy tab testing reported
  // as bare "Script error." with no detail). A `catch` block's Error object
  // is never subject to that redaction -- it's a completely different
  // mechanism (no browser-level cross-origin error event involved) -- so
  // every interactive handler in bindScreen() goes through `on()` below
  // instead of raw addEventListener, to get real diagnostics.
  function reportCaughtError(err){
    try {
      emit('slime:crash-report', {
        message: (err && err.message) || String(err),
        stack: (err && err.stack) || '',
        state: current.state
      });
    } catch (e) { /* never let error reporting itself throw */ }
  }

  // Deliberately swallows (never rethrows): if it did, the error would
  // propagate up through the browser's normal event dispatch and ALSO
  // trigger the global 'error' listener above, double-reporting the same
  // failure -- one accurate (from here) and one generic "Script error."
  // (from there), inflating a single real bug into two GitHub issues.
  function guarded(handler){
    return function(e){
      try { return handler(e); }
      catch (err) { reportCaughtError(err); }
    };
  }

  function on(el, type, handler){
    el.addEventListener(type, guarded(handler));
  }

  /* ===================== mousedown -> click activation workaround =====================
     Real-hardware finding (2026-07-12, Gigabyte GA-78LMT-S2P, cage 0.2.0 +
     cog + WPE on trixie): mouse clicks on buttons/cards/icons never
     register at all, while native input-focus-on-click and keyboard Enter
     both work fine. Matches a known category of Wayland click-completion
     bugs (compositors must pair pointer-button events with a "frame"
     completion signal for a browser's `click` to fire -- see
     cage-kiosk/cage#305 and related wlroots seat/frame issues; cage 0.2.0
     is a much newer version than this repo's other comments were written
     against, so the exact bug surface has shifted). Patching cage/cog/
     wlroots upstream isn't practical here, so the page compensates itself:
     synthesize a `click` from `mousedown` after a short grace window, but
     only if a real `click` didn't already arrive -- so exactly one click
     fires whether or not the platform's own synthesis works. Verified
     this doesn't double-fire in a normal browser (demo mode); needs
     real-hardware confirmation that it actually fixes the reported bug.
  */
  var pendingClickEl = null;
  document.addEventListener('mousedown', function(e){
    var el = e.target.closest('button, [tabindex]');
    if (!el) return;
    pendingClickEl = el;
    setTimeout(function(){
      if (pendingClickEl === el){
        pendingClickEl = null;
        el.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }));
      }
    }, 200);
  }, true);
  document.addEventListener('click', function(){ pendingClickEl = null; }, true);

  /* ===================== status strip ===================== */

  function setStatus(opts){
    opts = opts || {};
    if (opts.clock){
      var parts = opts.clock.split(':');
      var d = new Date();
      d.setHours(parseInt(parts[0], 10) || 0, parseInt(parts[1], 10) || 0, 0, 0);
      clockDate = d;
      renderClock();
      if (!clockTimer){
        clockTimer = setInterval(function(){
          if (!clockDate) return;
          clockDate = new Date(clockDate.getTime() + 30000);
          renderClock();
        }, 30000);
      }
    }
    if (opts.tunnel){
      renderTunnel(opts.tunnel);
    }
  }

  function renderClock(){
    if (!clockDate) return;
    var pad = function(n){ return String(n).padStart(2, '0'); };
    document.getElementById('clockLabel').textContent = pad(clockDate.getHours()) + ':' + pad(clockDate.getMinutes());
  }

  var lastTunnel = 'down';
  function renderTunnel(tunnel){
    lastTunnel = tunnel;
    var dot = document.getElementById('tunnelDot');
    var label = document.getElementById('tunnelLabel');
    var color = tunnel === 'up' ? '#00FF87' : tunnel === 'connecting' ? '#5FE6D2' : '#56616f';
    var text = tunnel === 'up' ? 'Secure tunnel' : tunnel === 'connecting' ? 'Connecting\u2026' : 'Not connected';
    dot.style.background = color;
    dot.style.boxShadow = '0 0 6px ' + color;
    label.style.color = color;
    label.textContent = text;
  }

  /* ===================== rendering ===================== */

  // States that can render inside the tabbed Settings panel (gear icon) --
  // always exactly the states whose `data.mode === 'settings'` (supportSettings
  // has no other mode). SETTINGS_TOP_STATES additionally marks which of
  // those show the tab bar: the top-level screen of each tab, matching
  // exactly the states whose `back` handling (see each do_*() in the
  // coordinator) closes the panel entirely rather than stepping back one
  // level within the same tab.
  var SETTINGS_STATES = { wifiList:1, wifiPassword:1, wifiConnecting:1, wifiError:1, pairEntry:1, pairConnecting:1, pairError:1, supportSettings:1, crashReportSettings:1 };
  var SETTINGS_TOP_STATES = { wifiList:1, pairEntry:1, supportSettings:1, crashReportSettings:1 };
  var SETTINGS_TABS = [
    { id: 'internet', label: 'Internet' },
    { id: 'pair', label: 'Pairing' },
    { id: 'support', label: 'Support' },
    { id: 'privacy', label: 'Privacy' }
  ];

  function settingsTabForState(state){
    if (state === 'pairEntry' || state === 'pairConnecting' || state === 'pairError') return 'pair';
    if (state === 'supportSettings') return 'support';
    if (state === 'crashReportSettings') return 'privacy';
    return 'internet';
  }

  function renderSettingsShell(state, innerHtml){
    var activeTab = settingsTabForState(state);
    var showTabs = !!SETTINGS_TOP_STATES[state];
    // wifiConnecting/pairConnecting are transient, no-button screens by
    // design (see their own render*() comments) -- no close affordance
    // there either, same reasoning.
    var showClose = state !== 'wifiConnecting' && state !== 'pairConnecting';
    var tabsHtml = SETTINGS_TABS.map(function(t){
      return '<button type="button" class="settings-tab' + (t.id === activeTab ? ' active' : '') + '" data-tab="' + t.id + '">' + t.label + '</button>';
    }).join('');
    return (
      '<div class="screen" data-screen="settings">' +
        '<div class="settings-panel">' +
          '<div class="settings-panel-header">' +
            '<h2 class="settings-title">Settings</h2>' +
            (showClose ? '<button type="button" class="settings-close" id="btnSettingsClose" title="Close" aria-label="Close">&times;</button>' : '') +
          '</div>' +
          (showTabs ? '<div class="settings-tabs" role="tablist">' + tabsHtml + '</div>' : '') +
          '<div class="settings-body">' + innerHtml + '</div>' +
        '</div>' +
      '</div>'
    );
  }

  function bindSettingsShell(state){
    try { bindSettingsShellImpl(state); }
    catch (err) { reportCaughtError(err); }
  }

  function bindSettingsShellImpl(state){
    var close = document.getElementById('btnSettingsClose');
    if (close) on(close, 'click', function(){ emit('slime:back'); });
    Array.prototype.forEach.call(document.querySelectorAll('.settings-tab'), function(btn){
      on(btn, 'click', function(){
        var tab = btn.getAttribute('data-tab');
        if (tab !== settingsTabForState(state)) emit('slime:settings-tab', { tab: tab });
      });
    });
  }

  // Wrapped like guarded()'s handlers, same reasoning: a thrown error here
  // (e.g. malformed data from the backend) gets full-fidelity message/stack
  // via this catch instead of the generic global fallback -- swallow, don't
  // rethrow, so it isn't double-reported.
  function render(){
    try { renderImpl(); }
    catch (err) { reportCaughtError(err); }
  }

  function renderImpl(){
    var state = current.state, data = current.data || {};
    var html = '';
    if (state === 'empty') html = renderEmpty(data);
    else if (state === 'picker') html = renderPicker(data);
    else if (state === 'addBrain') html = renderAddBrain();
    else if (state === 'credentials') html = renderCredentials(data);
    else if (state === 'connecting') html = renderConnecting(data);
    else if (state === 'error') html = renderError(data);
    else if (state === 'reconnecting') html = renderReconnecting(data);
    else if (state === 'disconnected') html = renderDisconnected();
    else if (state === 'wifiList') html = renderWifiList(data);
    else if (state === 'wifiPassword') html = renderWifiPassword(data);
    else if (state === 'wifiConnecting') html = renderWifiConnecting(data);
    else if (state === 'wifiError') html = renderWifiError(data);
    else if (state === 'pairEntry') html = renderPairEntry(data);
    else if (state === 'pairConnecting') html = renderPairConnecting(data);
    else if (state === 'pairError') html = renderPairError(data);
    else if (state === 'supportSettings') html = renderSupportSettings(data);
    else if (state === 'crashReportSettings') html = renderCrashReportSettings(data);
    else if (state === 'slimeIdConnecting') html = renderSlimeIdConnecting(data);
    else if (state === 'slimeIdEntry') html = renderSlimeIdEntry(data);
    else if (state === 'slimeIdError') html = renderSlimeIdError(data);

    var isSettingsPanel = SETTINGS_STATES[state] && data.mode === 'settings';
    if (isSettingsPanel) html = renderSettingsShell(state, html);

    screenRoot.innerHTML = html;
    bindScreen(state, data);
    if (isSettingsPanel) bindSettingsShell(state);
    autofocus(state);
  }

  function renderEmpty(data){
    return (
      '<div class="screen" data-screen="empty">' +
        '<span style="display:inline-block;animation:blobFloat 6s ease-in-out infinite;">' + slimeBlobSVG(96, 'color', true) + '</span>' +
        '<h1 class="title">Welcome to Slime OS</h1>' +
        '<p class="subtitle">Your Brain is a computer in the cloud that does the heavy lifting. Add one so this machine can connect to it.</p>' +
        '<button class="btn-primary" style="margin-top:36px;" id="btnAddBrain" data-autofocus>Add a Brain</button>' +
        (data.signedInEmail
          ? (
              '<p class="btn-ghost" style="margin-top:22px;margin-bottom:0;cursor:default;">Signed in as ' + escapeHtml(maskEmail(data.signedInEmail)) + '</p>' +
              '<button class="btn-ghost" style="padding:4px 8px;" id="btnSlimeIdLogout">Sign out</button>'
            )
          : '<button class="btn-ghost" style="margin-top:22px;" id="btnSlimeId">Sign in with Slime ID</button>') +
      '</div>'
    );
  }

  function renderPicker(data){
    var brains = data.brains || [];
    var cards = brains.map(function(b, i){
      var accent = ACCENTS[i % ACCENTS.length];
      var initial = (b.name || '?').trim().charAt(0).toUpperCase() || '?';
      var isRemote = !!b.remote;
      return (
        '<div class="brain-card' + (isRemote ? ' brain-card-bookmark' : '') + '" tabindex="0" role="listitem" data-brain-id="' + escapeHtml(b.id) + '"' + (i === 0 ? ' data-autofocus="1"' : '') + '>' +
          '<div class="brain-row">' +
            '<div class="brain-id">' +
              '<span class="brain-avatar" style="background:' + accent + ';">' + escapeHtml(initial) + '</span>' +
              '<div style="min-width:0;">' +
                '<div class="brain-name">' + escapeHtml(b.name) + (isRemote ? ' <span class="brain-bookmark-badge">Slime ID</span>' : '') + '</div>' +
                '<div class="brain-host">' + escapeHtml(b.host) + '</div>' +
              '</div>' +
            '</div>' +
            (isRemote ? '' : '<button class="brain-remove" title="Remove" data-remove-id="' + escapeHtml(b.id) + '">&times;</button>') +
          '</div>' +
          '<div class="brain-meta">' +
            (isRemote
              ? '<span class="last">Not paired on this device</span>'
              : '<span class="last">Last connected ' + escapeHtml(b.lastConnected || 'never') + '</span>') +
            '<span class="connect">' + (isRemote ? 'Tap to reconnect &rarr;' : 'Connect &rarr;') + '</span>' +
          '</div>' +
        '</div>'
      );
    }).join('');
    return (
      '<div class="screen" data-screen="picker">' +
        slimeBlobSVG(52, 'color', false) +
        '<h1 style="margin:20px 0 4px;font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:-.4px;color:#F2F6FB;">Choose a Brain</h1>' +
        '<p style="margin:0 0 32px;font-size:13.5px;color:var(--text-muted);">Press Enter on a card to connect</p>' +
        '<div class="picker-list" id="pickerList" role="list">' +
          cards +
          '<div class="add-card" id="btnAddBrainCard" tabindex="0" data-autofocus="' + (brains.length ? '0' : '1') + '">' +
            '<span style="font-size:20px;line-height:1;">+</span>' +
            '<span style="font-family:var(--font-display);font-weight:600;font-size:14.5px;">Add a Brain</span>' +
          '</div>' +
        '</div>' +
        (data.signedInEmail
          ? (
              '<p class="btn-ghost" style="margin-top:38px;margin-bottom:0;cursor:default;">Signed in as ' + escapeHtml(maskEmail(data.signedInEmail)) + '</p>' +
              '<button class="btn-ghost" style="padding:4px 8px;" id="btnSlimeIdLogout2">Sign out</button>'
            )
          : '<button class="btn-ghost" style="margin-top:38px;" id="btnSlimeId2">Sign in with Slime ID</button>') +
      '</div>'
    );
  }

  function renderAddBrain(){
    return (
      '<div class="screen" data-screen="addBrain">' +
        '<form class="card" id="addBrainForm" novalidate>' +
          '<h2 class="title">Add a Brain</h2>' +
          '<p style="margin:0 0 26px;font-size:13.5px;color:var(--text-muted);">Enter its name and address to connect.</p>' +
          '<label class="field-label">Name</label>' +
          '<input class="field" id="fieldName" placeholder="e.g. Home Office" data-autofocus>' +
          '<label class="field-label">Address</label>' +
          '<input class="field" id="fieldHost" placeholder="IP address or hostname" style="margin-bottom:0;">' +
          '<div id="hostError" style="min-height:22px;margin-top:8px;font-size:12.5px;color:var(--error);"></div>' +
          '<button type="button" class="btn-ghost" id="btnAdvanced" style="padding:4px 0;margin-top:8px;">+ Advanced (port)</button>' +
          '<div id="advancedPanel" class="hidden" style="margin-top:12px;">' +

  /* ===================== event binding ===================== */

  // Wrapped like render(): setup-time errors (e.g. a missing element) get
  // full-fidelity reporting via this catch instead of the generic global
  // fallback. Every listener registered inside bindScreenImpl uses on()/
  // guarded() so errors raised LATER, when the user actually interacts,
  // are equally well-diagnosed (this outer try/catch only covers binding
  // itself, not events that fire afterward).
  function bindScreen(state, data){
    try { bindScreenImpl(state, data); }
    catch (err) { reportCaughtError(err); }
  }

  function bindScreenImpl(state, data){
    if (state === 'empty'){
      document.getElementById('btnAddBrain').onclick = guarded(showLocalAddBrain);
      var slimeIdBtn = document.getElementById('btnSlimeId');
      if (slimeIdBtn) slimeIdBtn.onclick = guarded(function(){ emit('slime:slime-id-start'); });
      var slimeIdLogoutBtn = document.getElementById('btnSlimeIdLogout');
      if (slimeIdLogoutBtn) slimeIdLogoutBtn.onclick = guarded(function(){ emit('slime:slime-id-logout'); });
    }
    else if (state === 'picker'){
      var list = document.getElementById('pickerList');
      on(list, 'keydown', function(e){
        if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
        var focusable = Array.prototype.slice.call(list.querySelectorAll('[tabindex]'));
        var idx = focusable.indexOf(document.activeElement);
        if (idx === -1) return;
        e.preventDefault();
        var next = e.key === 'ArrowDown' ? Math.min(idx + 1, focusable.length - 1) : Math.max(idx - 1, 0);
        focusable[next].focus();
      });
      list.querySelectorAll('.brain-card').forEach(function(card){
        var id = card.getAttribute('data-brain-id');
        on(card, 'click', function(){ emit('slime:connect', { id: id }); });
        on(card, 'keydown', function(e){ if (e.key === 'Enter') emit('slime:connect', { id: id }); });
      });
      list.querySelectorAll('.brain-remove').forEach(function(btn){
        on(btn, 'click', function(e){
          e.stopPropagation();
          pendingRemoveId = btn.getAttribute('data-remove-id');
          var brains = (current.data && current.data.brains) || [];
          var b = brains.filter(function(x){ return String(x.id) === String(pendingRemoveId); })[0];
          showRemoveConfirm(b);
        });
      });
      on(document.getElementById('btnAddBrainCard'), 'click', showLocalAddBrain);
      on(document.getElementById('btnAddBrainCard'), 'keydown', function(e){ if (e.key === 'Enter') showLocalAddBrain(); });
      var slimeIdBtn2 = document.getElementById('btnSlimeId2');
      if (slimeIdBtn2) slimeIdBtn2.onclick = guarded(function(){ emit('slime:slime-id-start'); });
      var slimeIdLogoutBtn2 = document.getElementById('btnSlimeIdLogout2');
      if (slimeIdLogoutBtn2) slimeIdLogoutBtn2.onclick = guarded(function(){ emit('slime:slime-id-logout'); });
    }
    else if (state === 'addBrain'){
      var form = document.getElementById('addBrainForm');
      var advBtn = document.getElementById('btnAdvanced');
      var advPanel = document.getElementById('advancedPanel');
      on(advBtn, 'click', function(){
        var open = !advPanel.classList.contains('hidden');
        advPanel.classList.toggle('hidden');
        advBtn.textContent = open ? '+ Advanced (port)' : '\u2212 Hide advanced';
      });
      on(document.getElementById('btnCancelAdd'), 'click', function(){ emit('slime:back'); });
      on(form, 'submit', function(e){
        e.preventDefault();
        var name = document.getElementById('fieldName').value.trim();
        var host = document.getElementById('fieldHost').value.trim();
        var hostInput = document.getElementById('fieldHost');
        var errBox = document.getElementById('hostError');
        if (!host || !HOST_RE.test(host)){
          hostInput.classList.add('error');
          errBox.textContent = 'Enter a valid IP address or hostname.';
          hostInput.focus();
          return;
        }
        hostInput.classList.remove('error');
        errBox.textContent = '';
        var port = document.getElementById('fieldPort').value.trim() || '3389';
        emit('slime:add-brain', { name: name || 'Untitled Brain', host: host, port: port });
      });
    }
    else if (state === 'credentials'){
      var cform = document.getElementById('credentialsForm');
      var toggleBtn = document.getElementById('btnTogglePw');
      var pwField = document.getElementById('fieldPassword');
      on(toggleBtn, 'click', function(){
        var showing = pwField.type === 'text';
        pwField.type = showing ? 'password' : 'text';
        toggleBtn.textContent = showing ? 'SHOW' : 'HIDE';
      });
      on(document.getElementById('btnBackFromCreds'), 'click', function(){ emit('slime:back'); });
      on(cform, 'submit', function(e){
        e.preventDefault();
        var payload = { password: pwField.value };
        var uField = document.getElementById('fieldUsername');
        if (uField) payload.username = uField.value;
        emit('slime:credentials', payload);
      });
    }
    else if (state === 'connecting'){
      on(document.getElementById('btnCancelConnect'), 'click', function(){ emit('slime:cancel-connect'); });
    }
    else if (state === 'error'){
      on(document.getElementById('btnTryAgain'), 'click', function(){ emit('slime:retry'); });
      on(document.getElementById('btnReenterPassword'), 'click', function(){ emit('slime:reenter-password'); });
      on(document.getElementById('btnBackFromError'), 'click', function(){ emit('slime:back'); });
    }
    else if (state === 'reconnecting'){
      on(document.getElementById('btnBackFromReconnect'), 'click', function(){ emit('slime:back'); });
    }
    else if (state === 'wifiList'){
      var wlist = document.getElementById('wifiListRoot');
      on(wlist, 'keydown', function(e){
        if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
        var focusable = Array.prototype.slice.call(wlist.querySelectorAll('[tabindex]'));
        var idx = focusable.indexOf(document.activeElement);
        if (idx === -1) return;
        e.preventDefault();
        var next = e.key === 'ArrowDown' ? Math.min(idx + 1, focusable.length - 1) : Math.max(idx - 1, 0);
        focusable[next].focus();
      });
      wlist.querySelectorAll('.wifi-item').forEach(function(item){
        var ssid = item.getAttribute('data-ssid');
        on(item, 'click', function(){ emit('slime:wifi-connect', { ssid: ssid }); });
        on(item, 'keydown', function(e){ if (e.key === 'Enter') emit('slime:wifi-connect', { ssid: ssid }); });
      });
      var rescanBtn = document.getElementById('btnWifiRescan');
      if (rescanBtn) on(rescanBtn, 'click', function(){ emit('slime:wifi-rescan'); });
      var skipBtn = document.getElementById('btnWifiSkip');
      if (skipBtn) on(skipBtn, 'click', function(){ emit('slime:wifi-skip'); });
      var wbackBtn = document.getElementById('btnWifiBack');
      if (wbackBtn) on(wbackBtn, 'click', function(){ emit('slime:back'); });
    }
    else if (state === 'wifiPassword'){
      var wform = document.getElementById('wifiPasswordForm');
      var wToggle = document.getElementById('btnToggleWifiPw');
      var wPwField = document.getElementById('fieldWifiPassword');
      on(wToggle, 'click', function(){
        var showing = wPwField.type === 'text';
        wPwField.type = showing ? 'password' : 'text';
        wToggle.textContent = showing ? 'SHOW' : 'HIDE';
      });
      on(document.getElementById('btnBackFromWifiPw'), 'click', function(){ emit('slime:back'); });
      on(wform, 'submit', function(e){
        e.preventDefault();
        emit('slime:wifi-password', { password: wPwField.value });
      });
    }
    else if (state === 'wifiError'){
      on(document.getElementById('btnWifiTryAgain'), 'click', function(){ emit('slime:retry'); });
      var wReenter = document.getElementById('btnWifiReenterPassword');
      if (wReenter) on(wReenter, 'click', function(){ emit('slime:reenter-password'); });
      on(document.getElementById('btnBackFromWifiError'), 'click', function(){ emit('slime:back'); });
    }
    /* wifiConnecting has no interactive elements — nmcli connect is short and
       synchronous, unlike the long-lived xfreerdp session renderConnecting
       guards against, so no cancel affordance is needed. pairConnecting is
       the same shape, for the same reason. */
    else if (state === 'pairEntry'){
      var pform = document.getElementById('pairEntryForm');
      var pBackBtn = document.getElementById('btnBackFromPair');
      if (pBackBtn) on(pBackBtn, 'click', function(){ emit('slime:back'); });
      var pSkipBtn = document.getElementById('btnPairSkip');
      if (pSkipBtn) on(pSkipBtn, 'click', function(){ emit('slime:pair-skip'); });
      on(pform, 'submit', function(e){
        e.preventDefault();
        var hostInput = document.getElementById('fieldPairHost');
        var host = hostInput.value.trim();
        var errBox = document.getElementById('pairHostError');
        if (!host || !HOST_RE.test(host)){
          hostInput.classList.add('error');
          errBox.textContent = 'Enter a valid enrollment address.';
          hostInput.focus();
          return;
        }
        hostInput.classList.remove('error');
        var code = document.getElementById('fieldPairCode').value.trim();
        if (!code){
          errBox.textContent = 'Enter your pairing code.';
          return;
        }
        errBox.textContent = '';
        emit('slime:pair-submit', { host: host, code: code });
      });
    }
    else if (state === 'pairError'){
      on(document.getElementById('btnPairTryAgain'), 'click', function(){ emit('slime:retry'); });
      on(document.getElementById('btnBackFromPairError'), 'click', function(){ emit('slime:back'); });
    }
    else if (state === 'supportSettings'){
      on(document.getElementById('fieldSupportToggle'), 'change', function(e){
        emit('slime:support-toggle', { enabled: e.target.checked });
      });
    }
    else if (state === 'crashReportSettings'){
      on(document.getElementById('fieldCrashReportToggle'), 'change', function(e){
        emit('slime:crash-report-toggle', { enabled: e.target.checked });
      });
    }
    /* slimeIdConnecting has no interactive elements -- same reasoning as
       wifiConnecting/pairConnecting above. */
    else if (state === 'slimeIdEntry'){
      on(document.getElementById('btnSlimeIdBack'), 'click', function(){ emit('slime:back'); });
    }
    else if (state === 'slimeIdError'){
      on(document.getElementById('btnSlimeIdTryAgain'), 'click', function(){ emit('slime:retry'); });
      on(document.getElementById('btnBackFromSlimeIdError'), 'click', function(){ emit('slime:back'); });
    }
  }

  function autofocus(state){
    setTimeout(function(){
      var el = screenRoot.querySelector('[data-autofocus]');
      if (el && el.getAttribute('data-autofocus') !== '0') el.focus();
    }, 30);

  // Sent by the coordinator right after a brain is added locally, while
  // signed in to Slime ID (see the header comment's 'showSaveBrainPrompt'
  // entry) -- pure client overlay, same shape as showCrashConsentModal.
  // Echoes name/host/port back on both answers so the backend doesn't need
  // to track any state between the prompt and the reply.
  function showSaveBrainPromptModal(data){
    data = data || {};
    modalRoot.innerHTML =
      '<div class="modal-overlay">' +
        '<div class="modal-card">' +
          '<h3 style="margin:0 0 10px;font-family:var(--font-display);font-weight:700;font-size:16.5px;color:#F2F6FB;">Save to your Slime ID?</h3>' +

  // Client-only, non-interactive: once confirmed, the real machine is

  function showPowerOverlay(text){
    screenRoot.innerHTML =

          '<span class="spinner"></span>' +

  /* ===================== global keyboard (Esc = back/cancel) ===================== */

  on(document, 'keydown', function(e){
    if (e.key !== 'Escape') return;
    if (modalRoot.innerHTML.trim()){ closeModal(); return; }
    var s = current.state;
    if (s === 'connecting') emit('slime:cancel-connect');
    else if (s === 'addBrain' || s === 'credentials' || s === 'error' || s === 'reconnecting') emit('slime:back');
    else if (s === 'wifiPassword' || s === 'wifiError') emit('slime:back');
    else if (s === 'wifiList' && current.data && current.data.mode === 'settings') emit('slime:back');
    else if (s === 'pairError') emit('slime:back');
    else if (s === 'pairEntry' && current.data && current.data.mode === 'settings') emit('slime:back');
    else if (s === 'supportSettings') emit('slime:back');
    else if (s === 'crashReportSettings') emit('slime:back');
    else if (s === 'slimeIdEntry') emit('slime:back');
    else if (s === 'slimeIdError') emit('slime:back');
  });

        });
        // Auto-"approve" after a few seconds, purely so the demo click-through
        // has an ending -- the real flow polls the backend instead of a timer.
        setTimeout(function(){
          if (current.state !== 'slimeIdEntry') return; // user already backed out
          setStatus({ tunnel: 'down' });
          demoSignedInEmail = 'demo@slimeos.com';
          window.SlimeUI.setState('picker', { brains: demoBrains, signedInEmail: demoSignedInEmail });
        }, 4000);
      }, 600);
    }

    document.addEventListener('slime:slime-id-start', startDemoSlimeId);

    document.addEventListener('slime:slime-id-logout', function(){
      demoSignedInEmail = null;
      window.SlimeUI.setState('picker', { brains: demoBrains, signedInEmail: demoSignedInEmail });
    });

    document.addEventListener('slime:wifi-rescan', function(){
      window.SlimeUI.setState('wifiList', { networks: demoNetworks, scanning: true, mode: demoWifiMode, connectionType: (demoWifiMode === 'settings' ? 'ethernet' : ''), connectionSsid: '', skippable: demoWifiMode === 'boot' });
      setTimeout(function(){
        window.SlimeUI.setState('wifiList', { networks: demoNetworks, scanning: false, mode: demoWifiMode, connectionType: (demoWifiMode === 'settings' ? 'ethernet' : ''), connectionSsid: '', skippable: demoWifiMode === 'boot' });
      }, 900);
    });

    document.addEventListener('slime:wifi-skip', function(){
      demoWifiSsid = null;
      setStatus({ tunnel: 'down' });
      window.SlimeUI.setState('picker', { brains: demoBrains, signedInEmail: demoSignedInEmail });
    });

    document.addEventListener('slime:wifi-connect', function(e){
      var n = demoNetworks.filter(function(x){ return x.ssid === e.detail.ssid; })[0];
      if (!n) return;
      demoWifiSsid = n.ssid;
      if (n.secured){
        window.SlimeUI.setState('wifiPassword', { ssid: n.ssid, mode: demoWifiMode });
      } else {
        window.SlimeUI.setState('wifiConnecting', { ssid: n.ssid, stage: 'Connecting…' });
        setTimeout(function(){
          demoWifiSsid = null;
          setStatus({ tunnel: 'up' });
          window.SlimeUI.setState('picker', { brains: demoBrains, signedInEmail: demoSignedInEmail });
        }, 1200);
      }
    });

    document.addEventListener('slime:wifi-password', function(){
      window.SlimeUI.setState('wifiConnecting', { ssid: demoWifiSsid, stage: 'Connecting…' });
      setTimeout(function(){
        window.SlimeUI.setState('wifiError', { ssid: demoWifiSsid, message: "That password didn't work.", detail: 'secrets were required', mode: demoWifiMode, secured: true });
      }, 1200);
    });

    document.addEventListener('slime:reenter-password', function(){
      if (demoWifiSsid) window.SlimeUI.setState('wifiPassword', { ssid: demoWifiSsid, mode: demoWifiMode });
    });

    document.addEventListener('slime:pair-submit', function(){
      var pmode = (current.data && current.data.mode) || 'settings';
      window.SlimeUI.setState('pairConnecting', { stage: 'Fetching your Brain’s configuration…' });
      setTimeout(function(){
        window.SlimeUI.setState('pairError', { message: 'That code is invalid or has expired.', detail: 'invalid_or_expired (HTTP 404)', mode: pmode });
      }, 1200);
    });

    document.addEventListener('slime:pair-skip', function(){
      window.SlimeUI.setState('picker', { brains: demoBrains, signedInEmail: demoSignedInEmail });
    });

    setStatus({ clock: '14:32', tunnel: 'down' });
    window.SlimeUI.setState('picker', { brains: demoBrains, signedInEmail: demoSignedInEmail });

    document.addEventListener('slime:connect', function(e){
      var b = demoBrains.filter(function(x){ return String(x.id) === String(e.detail.id); })[0];
      if (!b) return;
      setStatus({ tunnel: 'connecting' });
      window.SlimeUI.setState('connecting', { brainName: b.name, stage: 'Waking up your Brain\u2026' });
      setTimeout(function(){
        window.SlimeUI.setState('connecting', { brainName: b.name, stage: 'Securing the connection\u2026' });
      }, 900);
      setTimeout(function(){
        setStatus({ tunnel: 'down' });
        window.SlimeUI.setState('error', { brainName: b.name, message: "That password didn't work.", detail: 'ERR_AUTH_1002' });
      }, 2000);
    });

    document.addEventListener('slime:retry', function(){
      if (current.state === 'slimeIdError'){
        startDemoSlimeId();
        return;
      }
      if (current.state === 'pairError'){
        window.SlimeUI.setState('pairConnecting', { stage: 'Fetching your Brain’s configuration…' });
        setTimeout(function(){
          setStatus({ tunnel: 'up' });
          window.SlimeUI.setState('picker', { brains: demoBrains, signedInEmail: demoSignedInEmail });
        }, 1200);
        return;
      }
      if (demoWifiSsid){
        window.SlimeUI.setState('wifiConnecting', { ssid: demoWifiSsid, stage: 'Connecting\u2026' });
        setTimeout(function(){
          demoWifiSsid = null;
          setStatus({ tunnel: 'up' });
          window.SlimeUI.setState('picker', { brains: demoBrains, signedInEmail: demoSignedInEmail });
        }, 1200);
        return;
      }
      setStatus({ tunnel: 'connecting' });
      window.SlimeUI.setState('connecting', { brainName: 'Home Office', stage: 'Waking up your Brain\u2026' });
      setTimeout(function(){
        setStatus({ tunnel: 'up' });
        window.SlimeUI.setState('reconnecting', { brainName: 'Home Office', attempt: 1 });
      }, 1600);
    });

    document.addEventListener('slime:back', function(){
      // Only reroute to wifiList when backing out of a *deeper* Wi-Fi
      // screen (password/error) -- backing out of wifiList itself must
      // fall through to the picker below, not re-render the same screen.
      if (demoWifiSsid !== null && (current.state === 'wifiPassword' || current.state === 'wifiError')){
        demoWifiSsid = null;
        window.SlimeUI.setState('wifiList', { networks: demoNetworks, scanning: false, mode: demoWifiMode, connectionType: (demoWifiMode === 'settings' ? 'ethernet' : ''), connectionSsid: '', skippable: demoWifiMode === 'boot' });
        return;
      }
      // Same shape for pairing: backing out of pairError returns to
      // pairEntry (not the picker); backing out of pairEntry itself falls
      // through to the picker below.
      if (current.state === 'pairError'){
        var pmode = current.data.mode || 'settings';
        window.SlimeUI.setState('pairEntry', { mode: pmode, skippable: pmode === 'boot' });
        return;
      }
      setStatus({ tunnel: 'down' });
      window.SlimeUI.setState('picker', { brains: demoBrains, signedInEmail: demoSignedInEmail });
    });

    document.addEventListener('slime:add-brain', function(e){
      demoBrains.push({ id: 'b' + (demoBrains.length + 1), name: e.detail.name, host: e.detail.host, lastConnected: 'never' });
      window.SlimeUI.setState('picker', { brains: demoBrains, signedInEmail: demoSignedInEmail });
    });

    document.addEventListener('slime:remove-brain', function(e){
      demoBrains = demoBrains.filter(function(x){ return String(x.id) !== String(e.detail.id); });
      window.SlimeUI.setState('picker', { brains: demoBrains, signedInEmail: demoSignedInEmail });
    });
  } else {
    /* ===================== bridge glue (real backend) ===================== */
    // Talks to slimeos-bridge (membrane/bridge/) over a loopback WebSocket.
    // Port is hardcoded, not templated: this bundle's whole design point is
    // "static file, zero build step" -- keep this in sync with --listen in
    // the slimeos-bridge.service unit (membrane/installer/install.sh).
    var BRIDGE_PORT = 7770;
    var backoffMs = 500;
    var ws = null;

    var EVENT_TO_TYPE = {
      'slime:add-brain': 'addBrain',
      'slime:connect': 'connect',
      'slime:remove-brain': 'removeBrain',
      'slime:credentials': 'credentials',
      'slime:retry': 'retry',
      'slime:reenter-password': 'reenterPassword',
      'slime:back': 'back',
      'slime:cancel-connect': 'cancelConnect',
      'slime:open-settings': 'openSettings',
      'slime:settings-tab': 'settingsTab',
      'slime:wifi-connect': 'wifiConnect',
      'slime:wifi-password': 'wifiPassword',
      'slime:wifi-rescan': 'wifiRescan',
      'slime:wifi-skip': 'wifiSkip',
      'slime:power-shutdown': 'powerShutdown',
      'slime:power-restart': 'powerRestart',
      'slime:pair-submit': 'pairSubmit',
      'slime:pair-skip': 'pairSkip',
      'slime:support-toggle': 'supportToggle',
      'slime:crash-report': 'crashReport',
      'slime:crash-consent': 'crashConsent',
      'slime:crash-report-toggle': 'crashReportToggle',
      'slime:slime-id-start': 'slimeIdStart',
      'slime:slime-id-logout': 'slimeIdLogout',
      'slime:save-brain-consent': 'saveBrainConsent'
    };

    function sendEvent(type, detail){
      // Guarded by readyState, not queued: while disconnected there's
      // nothing listening on the other end anyway, and the coordinator
      // always resyncs full state on the next successful connection.
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      var msg = { type: type };
      for (var k in detail){
        if (Object.prototype.hasOwnProperty.call(detail, k)) msg[k] = detail[k];
      }
      ws.send(JSON.stringify(msg));
    }

    Object.keys(EVENT_TO_TYPE).forEach(function(name){
      document.addEventListener(name, function(e){ sendEvent(EVENT_TO_TYPE[name], e.detail || {}); });
    });

    function connectBridge(){
      ws = new WebSocket('ws://127.0.0.1:' + BRIDGE_PORT + '/');
      ws.onopen = function(){ backoffMs = 500; };
      ws.onmessage = function(ev){
        var msg;
        try { msg = JSON.parse(ev.data); } catch (e) { return; }
        if (msg.type === 'setState') window.SlimeUI.setState(msg.state, msg.data);
        else if (msg.type === 'setStatus') window.SlimeUI.setStatus({ clock: msg.clock, tunnel: msg.tunnel });
        else if (msg.type === 'showCrashConsent') showCrashConsentModal();
        else if (msg.type === 'showSaveBrainPrompt') showSaveBrainPromptModal(msg.data);
      };
      ws.onclose = function(){
        window.SlimeUI.setState('disconnected', {});
        setTimeout(connectBridge, backoffMs);
        backoffMs = Math.min(backoffMs * 2, 5000);
      };
    }
    connectBridge();
  }
})();
</script>
