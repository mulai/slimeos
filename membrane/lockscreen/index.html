  // Sent by the coordinator at most once ever (see the header comment's
  // 'showRecoveryPin' entry) -- pure client overlay, same shape as
  // showCrashConsentModal, but a single acknowledgement button since
  // there's no choice to make. PIN styled the same as the Slime ID device
  // code (slimeIdEntry) -- both are a short code the user needs to read
  // and note down.
  function showRecoveryPinModal(pin){
    modalRoot.innerHTML =
      '<div class="modal-overlay">' +
        '<div class="modal-card">' +
          '<h3 style="margin:0 0 10px;font-family:var(--font-display);font-weight:700;font-size:16.5px;color:#F2F6FB;">Your recovery PIN</h3>' +
          '<p style="margin:0;font-size:13px;line-height:1.6;color:var(--text-muted);">Write this down and keep it safe -- it\'s the only way to log in directly to this device if Slime OS itself is ever unreachable.</p>' +
          '<p style="margin:14px 0 0;text-align:center;font-family:var(--font-mono);font-size:26px;font-weight:700;letter-spacing:3px;color:var(--mint);">' + escapeHtml(pin) + '</p>' +
          '<div style="display:flex;margin-top:22px;">' +
            '<button class="btn-primary" style="flex:1;padding:11px;box-shadow:none;" id="btnRecoveryPinOk">I\'ve saved it</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    document.getElementById('btnRecoveryPinOk').onclick = guarded(function(){
      emit('slime:recovery-pin-ack');
      closeModal();
    });
    modalRoot.querySelector('#btnRecoveryPinOk').focus();
  }

  // Client-only: pendingUpdateVersion is already known from the last
  // setStatus message (see the header comment's 'update' field) -- opening
  // this needs no round trip, same as showPowerConfirm(). Only "Update now"
  // talks to the backend, via 'slime:apply-update'.
  function showUpdateModal(version){
    modalRoot.innerHTML =
      '<div class="modal-overlay">' +
        '<div class="modal-card">' +
          '<h3 style="margin:0 0 10px;font-family:var(--font-display);font-weight:700;font-size:16.5px;color:#F2F6FB;">Update available</h3>' +
          '<p style="margin:0;font-size:13px;line-height:1.6;color:var(--text-muted);">Slime OS ' + escapeHtml(version) + ' is ready to install. Any active session will disconnect and the device will restart.</p>' +
          '<div style="display:flex;gap:10px;margin-top:22px;">' +
            '<button class="btn-secondary" style="flex:1;" id="btnUpdateLater">Later</button>' +
            '<button class="btn-primary" style="flex:1;padding:11px;box-shadow:none;" id="btnUpdateNow">Update now</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    document.getElementById('btnUpdateLater').onclick = guarded(closeModal);
    document.getElementById('btnUpdateNow').onclick = guarded(function(){
      showUpdateWorkingModal();
      emit('slime:apply-update');
    });
    modalRoot.querySelector('#btnUpdateNow').focus();
  }

  // Shown right after "Update now" is clicked, replacing the confirm modal
  // in place -- stays up until the backend answers with either
  // 'updateApplying' (verified, about to reboot -- see
  // showUpdateApplyingOverlay below) or 'updateFailed' (see
  // showUpdateFailedModal below). No buttons: there's nothing to route an
  // event to while the backend is mid-download/verify.
  function showUpdateWorkingModal(){
    modalRoot.innerHTML =
      '<div class="modal-overlay">' +
        '<div class="modal-card" style="text-align:center;">' +
          '<span class="spinner"></span>' +
          '<h3 style="margin:18px 0 0;font-family:var(--font-display);font-weight:700;font-size:16.5px;color:#F2F6FB;">Checking update…</h3>' +
        '</div>' +
      '</div>';
  }

  // Sent by the coordinator once the update has been downloaded and
  // checksum-verified and it's about to hand off to the privileged apply
  // helper (which reboots the device) -- see update.sh's do_apply_update().
  // Terminal, same as showPowerOverlay itself: nothing left to route an
  // event to once this fires.
  function showUpdateApplyingOverlay(){
    closeModal();
    showPowerOverlay('Updating Slime OS…');
  }

  // Sent by the coordinator if the update couldn't be verified/applied (bad
  // checksum, manifest drift, or a sudo-helper/sudoers grant missing on a
  // device that hasn't been reinstalled since this feature shipped) -- see
  // update.sh's do_apply_update(). Dismissing just closes back to whatever
  // screen was already showing underneath -- the current install was never
  // touched on this path, and the update icon reappears on the next
  // successful _updateTick if one is still available.
  function showUpdateFailedModal(message){
    modalRoot.innerHTML =
      '<div class="modal-overlay">' +
        '<div class="modal-card">' +
          '<h3 style="margin:0 0 10px;font-family:var(--font-display);font-weight:700;font-size:16.5px;color:#F2F6FB;">Update failed</h3>' +
          '<p style="margin:0;font-size:13px;line-height:1.6;color:var(--text-muted);">' + escapeHtml(message || "Couldn’t apply the update.") + '</p>' +
          '<div style="display:flex;margin-top:22px;">' +
            '<button class="btn-primary" style="flex:1;padding:11px;box-shadow:none;" id="btnUpdateFailedOk">OK</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    document.getElementById('btnUpdateFailedOk').onclick = guarded(closeModal);
    modalRoot.querySelector('#btnUpdateFailedOk').focus();
  }

  // Client-only, non-interactive: once confirmed, the real machine is
  // about to power off/reboot regardless of anything the backend does
  // next, so there's nothing left to route an event to.
  function showPowerOverlay(text){
    screenRoot.innerHTML =
      '<div class="screen" data-screen="powerOverlay">' +
        '<div class="reconnect-panel">' +
          '<span class="spinner"></span>' +
          '<h2 style="margin:18px 0 0;font-family:var(--font-display);font-weight:600;font-size:17px;color:#F2F6FB;">' + escapeHtml(text) + '</h2>' +
        '</div>' +
      '</div>';
  }

  /* ===================== global keyboard (Esc = back/cancel) ===================== */

  on(document, 'keydown', function(e){
    if (e.key !== 'Escape') return;
    if (modalRoot.innerHTML.trim()){ closeModal(); return; }
    var s = current.state;
    if (s === 'connecting' || s === 'sessionActive') emit('slime:cancel-connect');
    else if (s === 'addBrain' || s === 'credentials' || s === 'error' || s === 'reconnecting') emit('slime:back');
    else if (s === 'wifiPassword' || s === 'wifiError') emit('slime:back');
    else if (s === 'wifiList' && current.data && current.data.mode === 'settings') emit('slime:back');
    else if (s === 'pairError') emit('slime:back');
    else if (s === 'pairEntry' && current.data && current.data.mode === 'settings') emit('slime:back');
    else if (s === 'supportSettings') emit('slime:back');
    else if (s === 'timezoneSettings') emit('slime:back');
    else if (s === 'crashReportSettings') emit('slime:back');
    else if (s === 'slimeIdEntry') emit('slime:back');
    else if (s === 'slimeIdError') emit('slime:back');
  });

  /* Gear icon lives in the always-present status strip, outside #screenRoot,
     so it's bound once here rather than per-render in bindScreen(). */
  var btnOpenSettings = document.getElementById('btnOpenSettings');
  on(btnOpenSettings, 'click', function(){ emit('slime:open-settings'); });
  on(btnOpenSettings, 'keydown', function(e){ if (e.key === 'Enter') emit('slime:open-settings'); });

  var btnPower = document.getElementById('btnPower');
  on(btnPower, 'click', showPowerConfirm);
  on(btnPower, 'keydown', function(e){ if (e.key === 'Enter') showPowerConfirm(); });

  var btnUpdate = document.getElementById('btnUpdate');
  on(btnUpdate, 'click', function(){ if (pendingUpdateVersion) showUpdateModal(pendingUpdateVersion); });
  on(btnUpdate, 'keydown', function(e){ if (e.key === 'Enter' && pendingUpdateVersion) showUpdateModal(pendingUpdateVersion); });

  /* ===================== public API ===================== */

  window.SlimeUI = {
    setState: function(state, data){
      current = { state: state, data: data || {} };
      render();
    },
    setStatus: setStatus
  };

  var params = new URLSearchParams(window.location.search);
  var isDemo = params.get('demo') === '1';

  /* initial paint */
  if (isDemo){
    render();
  } else {
    // First frame ever painted, before any WS attempt -- see the bridge
    // glue at the bottom of this block.
    window.SlimeUI.setState('disconnected', {});
  }
  setStatus({ clock: '00:00', tunnel: 'down' });

  /* ===================== demo mode (?demo=1) ===================== */

  if (isDemo){
    ['slime:add-brain','slime:connect','slime:remove-brain','slime:credentials','slime:retry','slime:reenter-password','slime:back','slime:cancel-connect','slime:open-settings','slime:settings-tab','slime:wifi-connect','slime:wifi-password','slime:wifi-rescan','slime:wifi-skip','slime:power-shutdown','slime:power-restart','slime:pair-submit','slime:pair-skip','slime:support-toggle','slime:timezone-set','slime:speaker-volume-set','slime:speaker-test','slime:mic-volume-set','slime:mic-test','slime:camera-preview-start','slime:camera-preview-stop','slime:crash-report','slime:crash-consent','slime:crash-report-toggle','slime:slime-id-start','slime:slime-id-logout','slime:save-brain-consent','slime:recovery-pin-ack','slime:apply-update'].forEach(function(name){
      document.addEventListener(name, function(e){ console.log('[demo]', name, e.detail); });
    });

    var demoBrains = [
      { id: 'b1', name: 'Home Office', host: '192.168.1.42', lastConnected: '2 hours ago' },
      { id: 'b2', name: 'Azure Windows', host: 'azure-win.internal', lastConnected: '3 days ago' }
    ];

    var demoNetworks = [
      { ssid: 'HomeNet-5G', signal: 82, secured: true },
      { ssid: 'CoffeeShop', signal: 46, secured: false },
      { ssid: 'Neighbor_2.4', signal: 30, secured: true }
    ];
    var demoWifiSsid = null; // non-null while inside a Wi-Fi sub-flow, so the
                              // shared retry/back/reenter-password listeners
                              // below know whether to route to the Wi-Fi flow
                              // or the Brain-connect flow.
    var demoWifiMode = 'settings';
    var demoSupportEnabled = false;
    var demoSupportConnection = null;
    var demoCrashReportEnabled = false;
    var demoTimezone = 'UTC';
    var demoSignedInEmail = null;
    var demoSpeakerVolume = 65;
    var demoMicVolume = 50;
    var demoMicTesting = false;
    var demoMicTestResult = null;
    var demoCameraPreviewing = false;
    var demoCameraFrame = null;
    // A tiny 4:3 solid-colour JPEG data URI, swapped on each poll tick so
    // the demo preview visibly "updates" -- stands in for a real fswebcam
    // grab. (Colours cycle; content is irrelevant.)
    var DEMO_CAM_FRAMES = [
      'data:image/svg+xml;base64,' + btoa('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300"><rect width="400" height="300" fill="#123"/><circle cx="200" cy="150" r="70" fill="#00C2A8"/><text x="200" y="270" fill="#8aa" font-size="14" text-anchor="middle" font-family="monospace">demo preview</text></svg>'),
      'data:image/svg+xml;base64,' + btoa('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300"><rect width="400" height="300" fill="#132"/><circle cx="220" cy="140" r="70" fill="#00F2FE"/><text x="200" y="270" fill="#8aa" font-size="14" text-anchor="middle" font-family="monospace">demo preview</text></svg>')
    ];
    var demoCamTimer = null;
    var demoCamFrameIdx = 0;
    function demoCameraState(){
      return { mode: 'settings', available: true, previewing: demoCameraPreviewing, frameDataUrl: demoCameraFrame, error: null };
    }
    function demoStopCamTimer(){
      if (demoCamTimer){ clearInterval(demoCamTimer); demoCamTimer = null; }
    }

    document.addEventListener('slime:open-settings', function(){
      demoWifiMode = 'settings';
      window.SlimeUI.setState('wifiList', { networks: demoNetworks, scanning: false, mode: 'settings', connectionType: 'ethernet', connectionSsid: '', skippable: false });
    });

    document.addEventListener('slime:settings-tab', function(e){
      var tab = e.detail.tab;
      if (tab === 'internet'){
        window.SlimeUI.setState('wifiList', { networks: demoNetworks, scanning: false, mode: 'settings', connectionType: 'ethernet', connectionSsid: '', skippable: false });
      } else if (tab === 'pair'){
        window.SlimeUI.setState('pairEntry', { mode: 'settings', skippable: false });
      } else if (tab === 'speaker'){
        window.SlimeUI.setState('speakerSettings', { mode: 'settings', card: 'SB', volume: demoSpeakerVolume, error: null });
      } else if (tab === 'microphone'){
        window.SlimeUI.setState('microphoneSettings', { mode: 'settings', card: 'Device', volume: demoMicVolume, testing: demoMicTesting, testResult: demoMicTestResult, error: null });
      } else if (tab === 'camera'){
        demoStopCamTimer();
        window.SlimeUI.setState('cameraSettings', demoCameraState());
      } else if (tab === 'support'){
        window.SlimeUI.setState('supportSettings', { mode: 'settings', enabled: demoSupportEnabled, connection: demoSupportConnection, error: null, version: '0.1.0-demo' });
      } else if (tab === 'timezone'){
        window.SlimeUI.setState('timezoneSettings', { mode: 'settings', current: demoTimezone, timezones: ['UTC', 'Asia/Kuala_Lumpur', 'Asia/Singapore', 'America/New_York', 'Europe/London'], error: null });
      } else if (tab === 'privacy'){
        window.SlimeUI.setState('crashReportSettings', { mode: 'settings', enabled: demoCrashReportEnabled });
      } else if (tab === 'changelog'){
        window.SlimeUI.setState('changelogSettings', { mode: 'settings', version: '0.1.0-demo', changelog: 'Demo mode changelog text.', releasedAt: null, releasedRelative: '2 hours ago' });
      }
    });

    document.addEventListener('slime:support-toggle', function(e){
      demoSupportEnabled = !!e.detail.enabled;
      demoSupportConnection = demoSupportEnabled ? {
        host: '10.10.0.99',
        port: 22,
        username: 'slime',
        password: Math.random().toString(36).slice(2, 10)
      } : null;
      window.SlimeUI.setState('supportSettings', { mode: 'settings', enabled: demoSupportEnabled, connection: demoSupportConnection, error: null });
    });

    document.addEventListener('slime:crash-report-toggle', function(e){
      demoCrashReportEnabled = !!e.detail.enabled;
      window.SlimeUI.setState('crashReportSettings', { mode: 'settings', enabled: demoCrashReportEnabled });
    });

    document.addEventListener('slime:timezone-set', function(e){
      demoTimezone = e.detail.timezone;
      window.SlimeUI.setState('timezoneSettings', { mode: 'settings', current: demoTimezone, timezones: ['UTC', 'Asia/Kuala_Lumpur', 'Asia/Singapore', 'America/New_York', 'Europe/London'], error: null });
    });

    document.addEventListener('slime:speaker-volume-set', function(e){
      demoSpeakerVolume = e.detail.volume | 0;
      window.SlimeUI.setState('speakerSettings', { mode: 'settings', card: 'SB', volume: demoSpeakerVolume, error: null });
    });

    document.addEventListener('slime:speaker-test', function(){
      window.SlimeUI.setState('speakerSettings', { mode: 'settings', card: 'SB', volume: demoSpeakerVolume, error: null });
    });

    document.addEventListener('slime:mic-volume-set', function(e){
      demoMicVolume = e.detail.volume | 0;
      window.SlimeUI.setState('microphoneSettings', { mode: 'settings', card: 'Device', volume: demoMicVolume, testing: false, testResult: demoMicTestResult, error: null });
    });

    document.addEventListener('slime:mic-test', function(){
      demoMicTesting = true; demoMicTestResult = null;
      window.SlimeUI.setState('microphoneSettings', { mode: 'settings', card: 'Device', volume: demoMicVolume, testing: true, testResult: null, error: null });
      setTimeout(function(){
        demoMicTesting = false; demoMicTestResult = 'ok';
        if (current.state === 'microphoneSettings'){
          window.SlimeUI.setState('microphoneSettings', { mode: 'settings', card: 'Device', volume: demoMicVolume, testing: false, testResult: 'ok', error: null });
        }
      }, 3200);
    });

    document.addEventListener('slime:camera-preview-start', function(){
      demoCameraPreviewing = true;
      demoStopCamTimer();
      demoCamTimer = setInterval(function(){
        if (current.state !== 'cameraSettings' || !demoCameraPreviewing){ demoStopCamTimer(); return; }
        demoCameraFrame = DEMO_CAM_FRAMES[demoCamFrameIdx++ % DEMO_CAM_FRAMES.length];
        window.SlimeUI.setState('cameraSettings', demoCameraState());
      }, 1000);
      window.SlimeUI.setState('cameraSettings', demoCameraState());
    });

    document.addEventListener('slime:camera-preview-stop', function(){
      demoCameraPreviewing = false;
      demoCameraFrame = null;
      demoStopCamTimer();
      window.SlimeUI.setState('cameraSettings', demoCameraState());
    });

        });
        // Auto-"approve" after a few seconds, purely so the demo click-through
        // has an ending -- the real flow polls the backend instead of a timer.
        setTimeout(function(){
          if (current.state !== 'slimeIdEntry') return; // user already backed out
          setStatus({ tunnel: 'down' });
          demoSignedInEmail = 'demo@slimeos.com';
          window.SlimeUI.setState('picker', { brains: demoBrains, signedInEmail: demoSignedInEmail });
        }, 4000);
      }, 600);
    }

    document.addEventListener('slime:slime-id-start', startDemoSlimeId);

    document.addEventListener('slime:slime-id-logout', function(){
      demoSignedInEmail = null;
      window.SlimeUI.setState('picker', { brains: demoBrains, signedInEmail: demoSignedInEmail });
    });

    document.addEventListener('slime:wifi-rescan', function(){
      window.SlimeUI.setState('wifiList', { networks: demoNetworks, scanning: true, mode: demoWifiMode, connectionType: (demoWifiMode === 'settings' ? 'ethernet' : ''), connectionSsid: '', skippable: demoWifiMode === 'boot' });
      setTimeout(function(){
        window.SlimeUI.setState('wifiList', { networks: demoNetworks, scanning: false, mode: demoWifiMode, connectionType: (demoWifiMode === 'settings' ? 'ethernet' : ''), connectionSsid: '', skippable: demoWifiMode === 'boot' });
      }, 900);
    });

    document.addEventListener('slime:wifi-skip', function(){
      demoWifiSsid = null;
      setStatus({ tunnel: 'down' });
      window.SlimeUI.setState('picker', { brains: demoBrains, signedInEmail: demoSignedInEmail });
    });

    document.addEventListener('slime:wifi-connect', function(e){
      var n = demoNetworks.filter(function(x){ return x.ssid === e.detail.ssid; })[0];
      if (!n) return;
      demoWifiSsid = n.ssid;
      if (n.secured){
        window.SlimeUI.setState('wifiPassword', { ssid: n.ssid, mode: demoWifiMode });
      } else {
        window.SlimeUI.setState('wifiConnecting', { ssid: n.ssid, stage: 'Connecting…' });
        setTimeout(function(){
          demoWifiSsid = null;
          setStatus({ tunnel: 'up' });
          window.SlimeUI.setState('picker', { brains: demoBrains, signedInEmail: demoSignedInEmail });
        }, 1200);
      }
    });

    document.addEventListener('slime:wifi-password', function(){
      window.SlimeUI.setState('wifiConnecting', { ssid: demoWifiSsid, stage: 'Connecting…' });
      setTimeout(function(){
        window.SlimeUI.setState('wifiError', { ssid: demoWifiSsid, message: "That password didn't work.", detail: 'secrets were required', mode: demoWifiMode, secured: true });
      }, 1200);
    });

    document.addEventListener('slime:reenter-password', function(){
      if (demoWifiSsid) window.SlimeUI.setState('wifiPassword', { ssid: demoWifiSsid, mode: demoWifiMode });
    });

    document.addEventListener('slime:pair-submit', function(){
      var pmode = (current.data && current.data.mode) || 'settings';
      window.SlimeUI.setState('pairConnecting', { stage: 'Fetching your Brain’s configuration…' });
      setTimeout(function(){
        window.SlimeUI.setState('pairError', { message: 'That code is invalid or has expired.', detail: 'invalid_or_expired (HTTP 404)', mode: pmode });
      }, 1200);
    });

    document.addEventListener('slime:pair-skip', function(){
      window.SlimeUI.setState('picker', { brains: demoBrains, signedInEmail: demoSignedInEmail });
    });

    setStatus({ clock: '14:32', tunnel: 'down' });
    window.SlimeUI.setState('picker', { brains: demoBrains, signedInEmail: demoSignedInEmail });

    document.addEventListener('slime:connect', function(e){
      var b = demoBrains.filter(function(x){ return String(x.id) === String(e.detail.id); })[0];
      if (!b) return;
      setStatus({ tunnel: 'connecting' });
      window.SlimeUI.setState('connecting', { brainName: b.name, stage: 'Waking up your Brain\u2026' });
      setTimeout(function(){
        window.SlimeUI.setState('connecting', { brainName: b.name, stage: 'Securing the connection\u2026' });
      }, 900);
      setTimeout(function(){
        setStatus({ tunnel: 'down' });
        window.SlimeUI.setState('error', { brainName: b.name, message: "That password didn't work.", detail: 'ERR_AUTH_1002' });
      }, 2000);
    });

    document.addEventListener('slime:retry', function(){
      if (current.state === 'slimeIdError'){
        startDemoSlimeId();
        return;
      }
      if (current.state === 'pairError'){
        window.SlimeUI.setState('pairConnecting', { stage: 'Fetching your Brain’s configuration…' });
        setTimeout(function(){
          setStatus({ tunnel: 'up' });
          window.SlimeUI.setState('picker', { brains: demoBrains, signedInEmail: demoSignedInEmail });
        }, 1200);
        return;
      }
      if (demoWifiSsid){
        window.SlimeUI.setState('wifiConnecting', { ssid: demoWifiSsid, stage: 'Connecting\u2026' });
        setTimeout(function(){
          demoWifiSsid = null;
          setStatus({ tunnel: 'up' });
          window.SlimeUI.setState('picker', { brains: demoBrains, signedInEmail: demoSignedInEmail });
        }, 1200);
        return;
      }
      setStatus({ tunnel: 'connecting' });
      window.SlimeUI.setState('connecting', { brainName: 'Home Office', stage: 'Waking up your Brain\u2026' });
      setTimeout(function(){
        setStatus({ tunnel: 'up' });
        window.SlimeUI.setState('reconnecting', { brainName: 'Home Office', attempt: 1 });
      }, 1600);
    });

    document.addEventListener('slime:back', function(){
      // Only reroute to wifiList when backing out of a *deeper* Wi-Fi
      // screen (password/error) -- backing out of wifiList itself must
      // fall through to the picker below, not re-render the same screen.
      if (demoWifiSsid !== null && (current.state === 'wifiPassword' || current.state === 'wifiError')){
        demoWifiSsid = null;
        window.SlimeUI.setState('wifiList', { networks: demoNetworks, scanning: false, mode: demoWifiMode, connectionType: (demoWifiMode === 'settings' ? 'ethernet' : ''), connectionSsid: '', skippable: demoWifiMode === 'boot' });
        return;
      }
      // Same shape for pairing: backing out of pairError returns to
      // pairEntry (not the picker); backing out of pairEntry itself falls
      // through to the picker below.
      if (current.state === 'pairError'){
        var pmode = current.data.mode || 'settings';
        window.SlimeUI.setState('pairEntry', { mode: pmode, skippable: pmode === 'boot' });
        return;
      }
      setStatus({ tunnel: 'down' });
      window.SlimeUI.setState('picker', { brains: demoBrains, signedInEmail: demoSignedInEmail });
    });

    document.addEventListener('slime:add-brain', function(e){
      demoBrains.push({ id: 'b' + (demoBrains.length + 1), name: e.detail.name, host: e.detail.host, lastConnected: 'never' });
      window.SlimeUI.setState('picker', { brains: demoBrains, signedInEmail: demoSignedInEmail });
    });

    document.addEventListener('slime:remove-brain', function(e){
      demoBrains = demoBrains.filter(function(x){ return String(x.id) !== String(e.detail.id); });
      window.SlimeUI.setState('picker', { brains: demoBrains, signedInEmail: demoSignedInEmail });
    });
  } else {
    /* ===================== bridge glue (real backend) ===================== */
    // Talks to slimeos-bridge (membrane/bridge/) over a loopback WebSocket.
    // Port is hardcoded, not templated: this bundle's whole design point is
    // "static file, zero build step" -- keep this in sync with --listen in
    // the slimeos-bridge.service unit (membrane/installer/install.sh).
    var BRIDGE_PORT = 7770;
    var backoffMs = 500;
    var ws = null;

    var EVENT_TO_TYPE = {
      'slime:add-brain': 'addBrain',
      'slime:connect': 'connect',
      'slime:remove-brain': 'removeBrain',
      'slime:credentials': 'credentials',
      'slime:retry': 'retry',
      'slime:reenter-password': 'reenterPassword',
      'slime:back': 'back',
      'slime:cancel-connect': 'cancelConnect',
      'slime:open-settings': 'openSettings',
      'slime:settings-tab': 'settingsTab',
      'slime:wifi-connect': 'wifiConnect',
      'slime:wifi-password': 'wifiPassword',
      'slime:wifi-rescan': 'wifiRescan',
      'slime:wifi-skip': 'wifiSkip',
      'slime:power-shutdown': 'powerShutdown',
      'slime:power-restart': 'powerRestart',
      'slime:pair-submit': 'pairSubmit',
      'slime:pair-skip': 'pairSkip',
      'slime:support-toggle': 'supportToggle',
      'slime:timezone-set': 'timezoneSet',
      'slime:speaker-volume-set': 'speakerVolumeSet',
      'slime:speaker-test': 'speakerTest',
      'slime:mic-volume-set': 'micVolumeSet',
      'slime:mic-test': 'micTest',
      'slime:camera-preview-start': 'cameraPreviewStart',
      'slime:camera-preview-stop': 'cameraPreviewStop',
      'slime:crash-report': 'crashReport',
      'slime:crash-consent': 'crashConsent',
      'slime:crash-report-toggle': 'crashReportToggle',
      'slime:slime-id-start': 'slimeIdStart',
      'slime:slime-id-logout': 'slimeIdLogout',
      'slime:save-brain-consent': 'saveBrainConsent',
      'slime:recovery-pin-ack': 'recoveryPinAck',
      'slime:apply-update': 'applyUpdate'
    };

    function sendEvent(type, detail){
      // Guarded by readyState, not queued: while disconnected there's
      // nothing listening on the other end anyway, and the coordinator
      // always resyncs full state on the next successful connection.
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      var msg = { type: type };
      for (var k in detail){
        if (Object.prototype.hasOwnProperty.call(detail, k)) msg[k] = detail[k];
      }
      ws.send(JSON.stringify(msg));
    }

    Object.keys(EVENT_TO_TYPE).forEach(function(name){
      document.addEventListener(name, function(e){ sendEvent(EVENT_TO_TYPE[name], e.detail || {}); });
    });

    function connectBridge(){
      ws = new WebSocket('ws://127.0.0.1:' + BRIDGE_PORT + '/');
      ws.onopen = function(){ backoffMs = 500; };
      ws.onmessage = function(ev){
        var msg;
        try { msg = JSON.parse(ev.data); } catch (e) { return; }
        if (msg.type === 'setState') window.SlimeUI.setState(msg.state, msg.data);
        else if (msg.type === 'setStatus') window.SlimeUI.setStatus({ clock: msg.clock, tunnel: msg.tunnel, update: msg.update });
        else if (msg.type === 'showCrashConsent') showCrashConsentModal();
        else if (msg.type === 'showSaveBrainPrompt') showSaveBrainPromptModal(msg.data);
        else if (msg.type === 'showRecoveryPin') showRecoveryPinModal((msg.data || {}).pin);
        else if (msg.type === 'updateApplying') showUpdateApplyingOverlay();
        else if (msg.type === 'updateFailed') showUpdateFailedModal((msg.data || {}).message);
      };
      ws.onclose = function(){
        window.SlimeUI.setState('disconnected', {});
        setTimeout(connectBridge, backoffMs);
        backoffMs = Math.min(backoffMs * 2, 5000);
      };
    }
    connectBridge();
  }
})();
</script>
