apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace 'com.slimeos.app'
    compileSdkVersion = rootProject.ext.compileApi

    defaultConfig {
        applicationId "com.slimeos.app"
        minSdkVersion rootProject.ext.minApi
        targetSdkVersion rootProject.ext.targetApi
        versionCode 6
        versionName "1.0.4"
        // FreeRDP is only built for arm64 (release.properties ABI_FILTERS): keep the
        // other ABIs' WireGuard/SQLCipher libraries out, so the stores only offer
        // the app to devices that can run a session.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // Upload key for Play App Signing and AppGallery, kept outside the repo:
    // ~/.gradle/gradle.properties (or -P) sets SLIMEOS_UPLOAD_STORE_FILE,
    // SLIMEOS_UPLOAD_STORE_PASSWORD, SLIMEOS_UPLOAD_KEY_ALIAS and
    // SLIMEOS_UPLOAD_KEY_PASSWORD. Without them, release builds come out unsigned.
    signingConfigs {
        if (project.hasProperty('SLIMEOS_UPLOAD_STORE_FILE')) {
            upload {
                storeFile file(SLIMEOS_UPLOAD_STORE_FILE)
                storePassword SLIMEOS_UPLOAD_STORE_PASSWORD
                keyAlias SLIMEOS_UPLOAD_KEY_ALIAS
                keyPassword SLIMEOS_UPLOAD_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            if (project.hasProperty('SLIMEOS_UPLOAD_STORE_FILE')) {
                signingConfig signingConfigs.upload
            }
            // R8: shrinks and obfuscates (Play asks for it). Keep each release's
            // build/outputs/mapping/release/mapping.txt with its .aab: crash reports
            // (Reporter.kt) arrive with obfuscated names. Play gets it inside the .aab.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        // The release's R8 build signed with the debug key, so it installs over a debug
        // build (keeping its pairing) to test R8 on a device: ./gradlew :app:assembleR8test
        r8test {
            initWith release
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = "11"
    }
}

dependencies {
    implementation project(':freeRDPCore')
    // SlimeSessionActivity subclasses freeRDPCore's SessionActivity
    // (an AppCompatActivity); same version freeRDPCore uses.
    implementation 'androidx.appcompat:appcompat:1.7.1'

    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'

    // Official WireGuard Android tunnel library.
    implementation 'com.wireguard.android:tunnel:1.0.20260102'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}
