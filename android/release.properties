# Local SDK/NDK/CMake versions to match what's already installed, avoiding
# extra downloads. See android/README.md for the known gap: CMAKE_ARGUMENTS
# below disables FFmpeg/OpenH264/Opus/WebP/JPEG/PNG codec support because the
# FFmpeg source tarball download from GitHub has been unreliable in some dev
# environments (network stalls partway through a ~16MB transfer). This means
# freeRDPCore currently builds WITHOUT real RDP video/audio codec support —
# fine for compiling and wiring the pairing/tunnel/connect flow, but a real
# RDP session will not render video until this is turned back ON (flip the
# four WITH_* flags to ON below) on a machine/network that can complete the
# FFmpeg download.
COMPILE_API=36
TARGET_API=36
MIN_API=30
NDK_VERSION=30.0.14904198
CMAKE_VERSION=4.1.2
CMAKE_ARGUMENTS=-DWITH_FFMPEG=OFF;-DWITH_OPENH264=OFF;-DWITH_OPUS=OFF;-DWITH_WEBP=OFF;-DWITH_JPEG=OFF;-DWITH_PNG=OFF;-DWITH_CJSON=ON;-DWITH_OPENSSL=ON
ABI_FILTERS=arm64-v8a
