// Top-level build file. Mirrors the subset of upstream FreeRDP's own
// client/Android/Studio/build.gradle that freeRDPCore's build.gradle needs
// (rootProject.ext.*), since freeRDPCore is included here directly from the
// FreeRDP submodule rather than as part of its own Studio project.
buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.1'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0'
        classpath 'org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.1.0'
    }
}

Properties releaseProperties = new Properties()
File file = new File('release.properties')
if (file.canRead()) {
    releaseProperties.load(new FileInputStream(file))
}

ext {
    compileApi = releaseProperties.get('COMPILE_API', 36).toInteger()
    targetApi = releaseProperties.get('TARGET_API', 36).toInteger()
    minApi = releaseProperties.get('MIN_API', 29).toInteger()
    toolsVersion = releaseProperties.get('TOOLS_VERSION', '37.0.0')
    ndkVersion = releaseProperties.get('NDK_VERSION', '30.0.14904198')
    abiFilters = releaseProperties.get('ABI_FILTERS', 'arm64-v8a').split(';')
    cmakeArguments = releaseProperties.get('CMAKE_ARGUMENTS',
        '-DWITH_FFMPEG=OFF;-DWITH_OPENH264=OFF;-DWITH_OPUS=OFF;-DWITH_WEBP=OFF;-DWITH_JPEG=OFF;-DWITH_PNG=OFF;-DWITH_CJSON=ON;-DWITH_OPENSSL=ON'
    ).split(';')
    cmakeVersion = releaseProperties.get('CMAKE_VERSION', '4.1.2')
    splitEnabled = false
    splitArchs = releaseProperties.get('ABI_FILTERS', 'arm64-v8a').split(';')
    universal = true
}

allprojects {
    repositories {
        mavenCentral()
        google()
    }
    // freeRDPCore's own build.gradle (in the FreeRDP submodule, not ours to
    // edit) pins androidx.core:core:1.19.0, which requires compileSdk 37 —
    // not yet in the public SDK Manager. Force it down to a version that's
    // happy with compileSdk 36 instead of bumping compileApi further.
    configurations.all {
        resolutionStrategy {
            force 'androidx.core:core:1.15.0'
            force 'androidx.core:core-ktx:1.15.0'
            force 'androidx.lifecycle:lifecycle-runtime-compose-android:2.8.7'
            force 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
        }
    }
    subprojects {
        afterEvaluate { project ->
            if (project.hasProperty('android')) {
                project.android {
                    if (namespace == null) {
                        namespace 'com.freerdp.' + project.name.toLowerCase()
                    }
                }
            }
        }
    }
}
