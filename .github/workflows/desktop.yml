# The desktop app (#18): the Windows installer, and FreeRDP for the macOS
# app. The macOS app itself is built, signed and notarized on the Mac that
# holds the Developer ID certificate (desktop/app/package-macos.sh), from the
# freerdp-macos artifact this builds.
#
# A tag desktop-v<version> also publishes a GitHub release with the
# installer; package-macos.sh adds the .dmg to it.
name: Desktop app

on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/core/go.mod
          cache-dependency-path: desktop/core/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/app/src-tauri
      - name: Core tests
        working-directory: desktop/core
        run: go test ./...
      - name: Core
        shell: bash
        run: desktop/app/build-core.sh x86_64-pc-windows-msvc
      - name: App
        working-directory: desktop/app/src-tauri
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis
      - name: Name the installer
        shell: bash
        run: |
          mkdir dist
          cp desktop/app/src-tauri/target/release/bundle/nsis/*-setup.exe dist/Slime-OS-Setup-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/Slime-OS-Setup-x64.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --prerelease \
            --title "Slime OS desktop ${tag#desktop-v} (beta)" \
            --notes "Beta of the Slime OS desktop app for Windows and macOS. Download from https://www.slimeos.com/download"
          gh release upload "$tag" dist/Slime-OS-Setup-x64.exe --clobber

  # FreeRDP's own macOS bundle script (SDL3 client, universal arm64 + x86_64),
  # minus fdk-aac, and with H.264 decoded by the Mac's video hardware
  # (FFmpeg + VideoToolbox) instead of OpenH264 on the CPU. Cached: it only
  # changes with FREERDP_VERSION or CACHE_REV.
  freerdp-macos:
    runs-on: macos-15
    env:
      FREERDP_VERSION: 3.32.2
      CACHE_REV: 2
    steps:
      - id: cache
        uses: actions/cache@v4
        with:
          path: freerdp-macos.tar.gz
          key: freerdp-macos-${{ env.FREERDP_VERSION }}-${{ env.CACHE_REV }}
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          brew install ninja meson nasm autoconf automake libtool
          git clone --depth 1 -b "$FREERDP_VERSION" https://github.com/FreeRDP/FreeRDP.git
          # fdk-aac's licence is awkward to ship, and RDP audio doesn't need it.
          sed -i '' -e '/fdk-aac/d' -e 's/-DWITH_FDK_AAC=ON/-DWITH_FDK_AAC=OFF/' FreeRDP/scripts/bundle-mac-os.sh
          # FreeRDP tries OpenH264 before FFmpeg, so OpenH264 goes. FFmpeg's
          # software decoder stays as the fallback if VideoToolbox can't start.
          sed -i '' \
            -e 's/--enable-swscale /--enable-swscale --enable-avcodec --enable-decoder=h264 --enable-parser=h264 --enable-videotoolbox --enable-hwaccel=h264_videotoolbox /' \
            -e 's/-DWITH_FFMPEG=OFF/-DWITH_FFMPEG=ON -DWITH_VIDEO_FFMPEG=ON -DWITH_DSP_FFMPEG=OFF -DWITH_VIDEOTOOLBOX=ON/' \
            -e 's/-DWITH_OPENH264=ON/-DWITH_OPENH264=OFF/' \
            FreeRDP/scripts/bundle-mac-os.sh
          grep -q 'h264_videotoolbox' FreeRDP/scripts/bundle-mac-os.sh
          grep -q 'WITH_VIDEOTOOLBOX=ON' FreeRDP/scripts/bundle-mac-os.sh
          grep -q 'WITH_OPENH264=OFF' FreeRDP/scripts/bundle-mac-os.sh
          mkdir work && cd work
          ../FreeRDP/scripts/bundle-mac-os.sh
          fw=install/MacFreeRDP.app/Contents/Frameworks
          otool -L $fw/libfreerdp3.*.*.*.dylib | grep -q libavcodec
          if otool -L $fw/libfreerdp3.*.*.*.dylib | grep -q openh264; then exit 1; fi
          rm -f $fw/libopenh264*
          tar czf ../freerdp-macos.tar.gz -C install/MacFreeRDP.app Contents
      - uses: actions/upload-artifact@v4
        with:
          name: freerdp-macos
          path: freerdp-macos.tar.gz
