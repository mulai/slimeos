# The desktop app (#18): the Windows installer, and FreeRDP for the macOS
# app. The macOS app itself is built, signed and notarized on the Mac that
# holds the Developer ID certificate (desktop/app/package-macos.sh), from the
# freerdp-macos artifact this builds.
#
# A tag desktop-v<version> also publishes a GitHub release with the
# installer; package-macos.sh adds the .dmg to it.
name: Desktop app

on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/core/go.mod
          cache-dependency-path: desktop/core/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/app/src-tauri
      - name: Core tests
        working-directory: desktop/core
        run: go test ./...
      - name: Core
        shell: bash
        run: desktop/app/build-core.sh x86_64-pc-windows-msvc
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Remote desktop helper
        working-directory: desktop/rdp-windows
        run: |
          rc /nologo /fo slimeos-rdp.res slimeos-rdp.rc
          cl /nologo /std:c++17 /utf-8 /EHsc /O2 /MT /W3 /DUNICODE /D_UNICODE slimeos-rdp.cpp slimeos-rdp.res `
            /link /SUBSYSTEM:WINDOWS user32.lib ole32.lib oleaut32.lib `
            /OUT:..\app\src-tauri\binaries\slimeos-rdp-x86_64-pc-windows-msvc.exe
      - name: App
        working-directory: desktop/app/src-tauri
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis
      - name: Name the installer
        shell: bash
        run: |
          mkdir dist
          cp desktop/app/src-tauri/target/release/bundle/nsis/*-setup.exe dist/Slime-OS-Setup-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/Slime-OS-Setup-x64.exe
      # The Microsoft Store package (unsigned; the Store signs it), plus a
      # test-signed copy to install on a test PC. Identity from Partner
      # Center, in repository variables.
      - name: Store package
        working-directory: desktop/app
        env:
          MSIX_NAME: ${{ vars.MSIX_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY: ${{ vars.MSIX_PUBLISHER_DISPLAY }}
        run: |
          $version = (Get-Content -Raw src-tauri\tauri.conf.json | ConvertFrom-Json).version
          ./package-msix.ps1 -Version $version -Out ..\..\msix -TestSign
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msix
          path: msix/
      - name: Release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --prerelease \
            --title "Slime OS desktop ${tag#desktop-v} (beta)" \
            --notes "Beta of the Slime OS desktop app for Windows and macOS. Download from https://www.slimeos.com/download"
          gh release upload "$tag" dist/Slime-OS-Setup-x64.exe --clobber

  # FreeRDP's own macOS bundle script (SDL3 client, universal arm64 + x86_64),
  # minus fdk-aac, at a pinned development commit until 3.33 ships with:
  #   - the AVFoundation camera backend (rdpecam, off by default for clients)
  #   - the native VideoToolbox H.264 decoder (WITH_APPLE_VIDEOTOOLBOX, on by
  #     default on macOS; replaces 3.32's experimental FFmpeg hwaccel path)
  # OpenH264 stays: it encodes the camera for Windows. Cached: it only
  # changes with FREERDP_REF, CACHE_REV or desktop/freerdp-patches.
  freerdp-macos:
    runs-on: macos-15
    env:
      FREERDP_REF: e67595f48b4a98bf2cb9ac50db44531e0c2d4b45 # master, 2026-11-03
      CACHE_REV: 2
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: freerdp-macos.tar.gz
          key: freerdp-macos-${{ env.FREERDP_REF }}-${{ env.CACHE_REV }}-${{ hashFiles('desktop/freerdp-patches/**') }}
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          brew install ninja meson nasm autoconf automake libtool
          git init -q FreeRDP
          git -C FreeRDP fetch -q --depth 1 https://github.com/FreeRDP/FreeRDP.git "$FREERDP_REF"
          git -C FreeRDP checkout -q FETCH_HEAD
          # macOS full screen: the session window lost its Space to the screen-size
          # probe's. FreeRDP#13841 until it lands (#13979, the other half, is in).
          git -C FreeRDP apply ../desktop/freerdp-patches/sdl-macos-fullscreen.patch
          # The camera: OpenH264, not 95b13d53's VideoToolbox encoder (no frame
          # ever showed on Windows). VideoToolbox still decodes the session.
          git -C FreeRDP apply ../desktop/freerdp-patches/camera-openh264.patch
          # cfb77bd0 clears the TLS BIO's retry flag outside its lock: a write on
          # one thread can wipe a read's "try again", and the session drops.
          git -C FreeRDP apply ../desktop/freerdp-patches/tls-retry-race.patch
          # fdk-aac's licence is awkward to ship, and RDP audio doesn't need it.
          sed -i '' -e '/fdk-aac/d' -e 's/-DWITH_FDK_AAC=ON/-DWITH_FDK_AAC=OFF/' FreeRDP/scripts/bundle-mac-os.sh
          sed -i '' -e 's/-DWITH_OPENH264=ON/-DWITH_OPENH264=ON -DWITH_APPLE_VIDEOTOOLBOX=ON -DCHANNEL_RDPECAM_CLIENT=ON/' \
            FreeRDP/scripts/bundle-mac-os.sh
          grep -q 'CHANNEL_RDPECAM_CLIENT=ON' FreeRDP/scripts/bundle-mac-os.sh
          FreeRDP/scripts/bundle-mac-os.sh
          out=FreeRDP/build-macos
          grep -q 'WITH_APPLE_VIDEOTOOLBOX:BOOL=ON' $out/build/freerdp/CMakeCache.txt
          grep -q 'CHANNEL_RDPECAM_CLIENT:BOOL=ON' $out/build/freerdp/CMakeCache.txt
          tar czf freerdp-macos.tar.gz -C $out/install/MacFreeRDP.app Contents
      - uses: actions/upload-artifact@v4
        with:
          name: freerdp-macos
          path: freerdp-macos.tar.gz
