# XcodeGen spec: `xcodegen` in this folder writes SlimeOS.xcodeproj (gitignored).
# FreeRDP comes from ios/scripts/stage-freerdp.sh (see README.md).
name: SlimeOS
options:
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  WireGuardKit:
    path: Vendor/wireguard-apple # ios/scripts/fetch-wireguard.sh
targets:
  # Builds wireguard-go (libwg-go.a) for WireGuardKit, as its README describes.
  WireGuardGoBridgeiOS:
    type: ""
    platform: iOS
    legacy:
      toolPath: /usr/bin/make
      arguments: $(ACTION)
      workingDirectory: $(PROJECT_DIR)/Vendor/wireguard-apple/Sources/WireGuardKitGo
      passSettings: true
  SlimeTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: SlimeTunnel
    info:
      path: SlimeTunnel/Info.plist
      properties:
        CFBundleDisplayName: Slime OS Tunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.slimeos.app.tunnel
        CODE_SIGN_ENTITLEMENTS: SlimeTunnel/SlimeTunnel.entitlements
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: WireGuardKit
      - target: WireGuardGoBridgeiOS
        link: false
  SlimeOS:
    type: application
    platform: iOS
    sources:
      - path: SlimeOS
    info:
      path: SlimeOS/Info.plist
      properties:
        CFBundleDisplayName: Slime OS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        NSLocalNetworkUsageDescription: Slime OS connects to Brains on your local network.
        # Export compliance (docs/app-store-listing.md): standard algorithms only
        # (WireGuard, TLS), App Store outside France, so no documentation is needed
        # and builds needn't ask. Revisit before adding France.
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - space_grotesk.ttf
          - plus_jakarta_sans.ttf
          - jetbrains_mono.ttf
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: SlimeMark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.slimeos.app
        CODE_SIGN_ENTITLEMENTS: SlimeOS/SlimeOS.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        GCC_C_LANGUAGE_STANDARD: gnu2x
        SWIFT_OBJC_BRIDGING_HEADER: SlimeOS/Bridge/SlimeOS-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(PROJECT_DIR)/Vendor/FreeRDP/include/freerdp3
          - $(PROJECT_DIR)/Vendor/FreeRDP/include/winpr3
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
    dependencies:
      - target: SlimeTunnel
      - framework: Vendor/FreeRDP/freerdp3.xcframework
        embed: true
      - framework: Vendor/FreeRDP/freerdp-client3.xcframework
        embed: true
      - framework: Vendor/FreeRDP/winpr3.xcframework
        embed: true
      - framework: Vendor/FreeRDP/ssl.xcframework
        embed: true
      - framework: Vendor/FreeRDP/crypto.xcframework
        embed: true
      - framework: Vendor/FreeRDP/openh264.xcframework
        embed: true
      - framework: Vendor/FreeRDP/cjson.xcframework
        embed: true
      - framework: Vendor/FreeRDP/uriparser.xcframework
        embed: true
